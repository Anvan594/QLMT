<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QLTSTB — Quản lý Tài sản Thiết bị Văn Phòng - Công Ty</title>
<style>
  :root{
    --navy-950:#0a1f2b;
    --navy-900:#0d2836;
    --navy-800:#123443;
    --teal-600:#0d9488;
    --teal-500:#14b8a6;
    --teal-050:#e6fbf8;
    --blue-600:#2563eb;
    --blue-700:#1d4ed8;
    --bg:#eef3f2;
    --card:#ffffff;
    --border:#dbe5e2;
    --ink-900:#0f2027;
    --ink-600:#4b6266;
    --ink-400:#8098a0;
    --ok:#0f8a4b; --ok-bg:#dcf7e6;
    --warn:#b4650a; --warn-bg:#fdf0d8;
    --danger:#c62a2a; --danger-bg:#fde3e3;
    --muted:#5c7278; --muted-bg:#e7edec;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink-900);
    font-size:14px;
  }
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;font-size:14px;}
  :focus-visible{outline:2px solid var(--teal-500);outline-offset:2px;}

  .app{display:none;min-height:100vh;}
  .app.visible{display:flex;}

  /* Sidebar */
  .sidebar{
    width:230px;flex-shrink:0;background:var(--navy-950);
    color:#cfe3e0;display:flex;flex-direction:column;
    padding:20px 14px;
  }
  .brand{display:flex;align-items:center;gap:10px;padding:4px 6px 22px 6px;}
  .brand .mark{width:34px;height:34px;border-radius:9px;object-fit:cover;display:block;flex-shrink:0;}
  .brand .name{font-weight:800;letter-spacing:.03em;color:#f2fbfa;font-size:15px;}
  .brand .sub{font-size:10.5px;color:#7aa39d;letter-spacing:.08em;text-transform:uppercase;}

  .nav{display:flex;flex-direction:column;gap:3px;margin-top:8px;}
  .nav-item{
    display:flex;align-items:center;gap:10px;
    background:transparent;border:none;color:#a9c4c0;
    padding:10px 12px;border-radius:8px;text-align:left;font-size:13.5px;font-weight:500;
    border-left:3px solid transparent;
  }
  .nav-item:hover{background:rgba(255,255,255,.05);color:#eafbf8;}
  .nav-item.active{background:rgba(20,184,166,.14);color:#7ce9dc;border-left:3px solid var(--teal-500);font-weight:700;}
  .nav-item .ic{width:18px;text-align:center;}

  /* Donation Box */
  .donate-box{
    margin-top:20px;
    padding:12px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.12);
    border-radius:10px;
    text-align:center;
    color:#e0f2fe;
    font-size:11px;
    line-height:1.4;
  }
  .donate-box .donate-title{
    font-weight:700;
    color:#38bdf8;
    margin-bottom:8px;
    font-size:11.5px;
    text-transform:uppercase;
    letter-spacing:.03em;
  }
  .donate-box img.qr-code{
    width:130px;
    height:130px;
    border-radius:6px;
    background:#fff;
    padding:4px;
    margin:6px auto;
    display:block;
  }
  .donate-info{
    margin-top:6px;
    text-align:left;
    background:rgba(0,0,0,.25);
    padding:6px 8px;
    border-radius:6px;
    font-size:10.5px;
  }
  .donate-info div{ margin-bottom:2px; }
  .donate-info div:last-child{ margin-bottom:0; }
  .donate-info strong{ color:#fff; }

  .sidebar-footer{padding-top:12px;margin-top:auto;font-size:11px;color:#547f7a;line-height:1.5;border-top:1px solid rgba(255,255,255,.08);}

  /* Current user box */
  .current-user-box{margin-top:14px;padding:10px 12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:10px;}
  .current-user-box .cu-name{font-size:12.5px;font-weight:700;color:#eafbf8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .current-user-box .cu-role{font-size:10.5px;color:#7aa39d;text-transform:uppercase;letter-spacing:.05em;margin-top:1px;margin-bottom:8px;}
  .current-user-box .cu-logout{width:100%;justify-content:center;color:#a9c4c0;border:1px solid rgba(255,255,255,.14);}
  .current-user-box .cu-logout:hover{background:rgba(255,255,255,.08);color:#eafbf8;}

  /* Login screen */
  .login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--navy-950),var(--navy-800));padding:24px;}
  .login-card{width:100%;max-width:360px;background:var(--card);border-radius:16px;padding:32px 28px 26px;box-shadow:0 20px 60px rgba(0,0,0,.35);}
  .login-brand{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
  .login-brand .mark{width:38px;height:38px;border-radius:9px;object-fit:cover;}
  .login-brand .name{font-weight:800;letter-spacing:.03em;color:var(--navy-950);font-size:16px;}
  .login-brand .sub{font-size:10.5px;color:var(--ink-600);letter-spacing:.08em;text-transform:uppercase;}
  .login-card h2{font-size:16px;margin:0 0 18px;color:var(--ink-900);}
  .login-notice{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:9px 11px;font-size:12.5px;margin-bottom:14px;}
  .login-error{background:var(--danger-bg);color:var(--danger);border-radius:8px;padding:9px 11px;font-size:12.5px;margin-bottom:14px;}
  .login-submit{width:100%;justify-content:center;padding:11px 16px;font-size:14px;margin-top:4px;}
  .login-hint{margin-top:16px;font-size:11.5px;color:var(--ink-400);text-align:center;}
  .login-hint code{background:var(--bg);border-radius:4px;padding:1px 5px;}

  /* Content */
  .content{flex:1;min-width:0;padding:26px 30px 60px;}
  .page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px;flex-wrap:wrap;}
  .page-head h1{font-size:20px;margin:0 0 4px;letter-spacing:.01em;display:flex;align-items:center;gap:10px;}
  .page-head .desc{color:var(--ink-600);font-size:13px;}
  .head-actions{display:flex;gap:8px;flex-wrap:wrap;}

  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px;}
  .card h3{margin:0 0 4px;font-size:14.5px;}
  .card .hint{color:var(--ink-600);font-size:12.5px;margin-bottom:12px;}

  .btn{border:1px solid transparent;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:transform .05s;}
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--navy-900);color:#fff;}
  .btn-primary:hover{background:var(--navy-800);}
  .btn-teal{background:var(--teal-600);color:#fff;}
  .btn-teal:hover{background:#0b7d72;}
  .btn-blue{background:var(--blue-600);color:#fff;border-radius:4px;padding:8px 14px;font-weight:500;}
  .btn-blue:hover{background:var(--blue-700);}
  .btn-outline{background:#fff;border-color:var(--border);color:var(--ink-900);}
  .btn-outline:hover{background:#f5f9f8;}
  .btn-danger{background:#fff;border-color:#f2c6c6;color:var(--danger);}
  .btn-danger:hover{background:var(--danger-bg);}
  .btn-warn{background:#fff;border-color:#f0dcae;color:var(--warn);}
  .btn-ghost{background:transparent;color:var(--ink-600);}
  .btn-sm{padding:6px 11px;font-size:12px;}
  .btn-xs{padding:3px 7px;font-size:11.5px;border-radius:5px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}

  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-600);margin-bottom:5px;}
  .field label .req{color:var(--danger);}
  .field input, .field select, .field textarea{
    width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;background:#fbfdfc;color:var(--ink-900);
  }
  .field input:focus, .field select:focus, .field textarea:focus{background:#fff;border-color:var(--teal-500);}
  .field textarea{resize:vertical;min-height:90px;}
  .field.inline{display:flex;gap:8px;align-items:flex-end;}
  .field.inline input{flex:1;}
  .field .unit-select{max-width:100px;}
  .section-title{font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--teal-600);
    display:flex;align-items:center;gap:8px;margin:22px 0 14px;}
  .section-title:first-child{margin-top:0;}
  .section-title::after{content:"";flex:1;height:1px;background:var(--border);}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
  .search-box{flex:1;min-width:220px;position:relative;}
  .search-box input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--border);border-radius:8px;background:#fff;}
  .search-box .ic{position:absolute;left:11px;top:9px;color:var(--ink-400);}
  .filters{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:10px;}
  .filters select, .filters input{width:100%;padding:8px 9px;border:1px solid var(--border);border-radius:8px;background:#fff;font-size:12.5px;}
  .filters-row2{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
  .filters-row2 .grp{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-600);}
  .filters-row2 input[type=date]{padding:7px 8px;border:1px solid var(--border);border-radius:7px;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{background:var(--navy-950);color:#dff3f0;text-align:left;padding:10px 12px;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;font-weight:700;}
  thead th:first-child{border-radius:8px 0 0 0;}
  thead th:last-child{border-radius:0 8px 0 0;}
  tbody td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top;}
  tbody tr:hover{background:#f6faf9;}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:700;color:var(--navy-800);}
  .sub{display:block;color:var(--ink-400);font-size:11.5px;margin-top:2px;}
  .empty-row td{text-align:center;padding:46px 10px;color:var(--ink-400);}

  .badge{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:99px;font-size:11.5px;font-weight:700;}
  .badge.ok{background:var(--ok-bg);color:var(--ok);}
  .badge.warn{background:var(--warn-bg);color:var(--warn);}
  .badge.danger{background:var(--danger-bg);color:var(--danger);}
  .badge.muted{background:var(--muted-bg);color:var(--muted);}

  .table-footer{display:flex;justify-content:space-between;align-items:center;margin-top:14px;flex-wrap:wrap;gap:10px;}
  .table-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .pager{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-600);}
  .pager select{padding:5px 7px;border:1px solid var(--border);border-radius:6px;}
  .pager button{border:1px solid var(--border);background:#fff;border-radius:6px;padding:5px 9px;}
  .pager button:disabled{opacity:.4;}

  .tabs{display:flex;gap:6px;margin-bottom:14px;}
  .tab{padding:8px 16px;border-radius:8px;border:1px solid var(--border);background:#fff;font-size:12.5px;font-weight:600;color:var(--ink-600);}
  .tab.active{background:var(--navy-950);color:#fff;border-color:var(--navy-950);}

  .stat-total{background:linear-gradient(120deg,var(--navy-950),var(--navy-800));color:#fff;}
  .stat-total td{color:#fff;font-weight:800;border-bottom:none;}
  .stat-group td{background:#eef7f5;font-weight:700;}

  /* Dashboard */
  .kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:20px;}
  @media (max-width:1150px){.kpi-grid{grid-template-columns:repeat(3,1fr);}}
  @media (max-width:640px){.kpi-grid{grid-template-columns:repeat(2,1fr);}}
  .kpi-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px;}
  .kpi-card .kpi-top{display:flex;align-items:center;justify-content:space-between;}
  .kpi-card .kpi-ic{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
  .kpi-card .kpi-val{font-size:23px;font-weight:800;color:var(--ink-900);line-height:1.1;}
  .kpi-card .kpi-lbl{font-size:11.5px;color:var(--ink-600);font-weight:600;line-height:1.35;}
  .kpi-card.tone-navy .kpi-ic{background:var(--navy-950);color:#fff;}
  .kpi-card.tone-ok .kpi-ic{background:var(--ok-bg);color:var(--ok);}
  .kpi-card.tone-warn .kpi-ic{background:var(--warn-bg);color:var(--warn);}
  .kpi-card.tone-danger .kpi-ic{background:var(--danger-bg);color:var(--danger);}
  .kpi-card.tone-muted .kpi-ic{background:var(--muted-bg);color:var(--muted);}
  .kpi-card.tone-teal .kpi-ic{background:var(--teal-050);color:var(--teal-600);}
  .kpi-card.tone-blue .kpi-ic{background:#e3ecfd;color:var(--blue-600);}

  /* Settings tiles */
  .settings-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  @media (max-width:900px){.settings-tiles{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:640px){.settings-tiles{grid-template-columns:1fr;}}
  .settings-tile{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:4px;transition:border-color .12s,box-shadow .12s;}
  .settings-tile:hover{border-color:var(--teal-500);box-shadow:0 2px 10px rgba(13,148,136,.08);}
  .settings-tile .st-ic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;margin-bottom:6px;flex-shrink:0;}
  .settings-tile.tone-teal .st-ic{background:var(--teal-050);color:var(--teal-600);}
  .settings-tile.tone-blue .st-ic{background:#e3ecfd;color:var(--blue-600);}
  .settings-tile.tone-navy .st-ic{background:var(--navy-950);color:#fff;}
  .settings-tile.tone-warn .st-ic{background:var(--warn-bg);color:var(--warn);}
  .settings-tile h4{margin:0 0 2px;font-size:14px;color:var(--ink-900);}
  .settings-tile .st-hint{color:var(--ink-600);font-size:12px;line-height:1.5;margin-bottom:12px;flex:1;}
  .settings-tile .btn{align-self:flex-start;}
  .settings-card-head{display:flex;align-items:center;gap:10px;margin-bottom:2px;}
  .settings-card-head .sc-ic{width:34px;height:34px;border-radius:9px;background:var(--teal-050);color:var(--teal-600);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
  .settings-card-head h3{margin:0;}

  .charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media (max-width:960px){.charts-grid{grid-template-columns:1fr;}}
  .chart-card h3{display:flex;align-items:center;gap:8px;margin-bottom:2px;}
  .bar-row{display:grid;grid-template-columns:118px 1fr 96px;align-items:center;gap:10px;margin-bottom:9px;font-size:12.5px;}
  .bar-row:last-child{margin-bottom:0;}
  .bar-label{color:var(--ink-600);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;}
  .bar-track{background:var(--bg);border-radius:6px;height:10px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--teal-600),var(--teal-500));}
  .bar-value{text-align:right;font-weight:700;color:var(--ink-900);white-space:nowrap;}
  .chart-empty{color:var(--ink-400);font-size:12.5px;padding:22px 4px;text-align:center;}

  .action-btns{display:flex;gap:4px;flex-wrap:nowrap;}

  .quick-tools-bar{
    display:flex;gap:10px;margin-top:12px;margin-bottom:18px;flex-wrap:wrap;
  }

  /* Modal */
  .modal-backdrop{position:fixed;inset:0;background:rgba(10,26,32,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal{background:#fff;border-radius:14px;max-width:900px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.3);}
  .modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff;z-index:2;}
  .modal-head h2{font-size:16px;margin:0;}
  .modal-close{background:none;border:none;font-size:20px;color:var(--ink-400);line-height:1;padding:4px;}
  .modal-body{padding:20px 22px;}
  .modal-foot{padding:16px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;position:sticky;bottom:0;background:#fff;}

  .picker-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .picker-col h4{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-600);margin:0 0 8px;}
  .picker-list{border:1px solid var(--border);border-radius:8px;height:260px;overflow:auto;background:#fbfdfc;}
  .picker-list .item{padding:9px 12px;font-size:13px;border-bottom:1px solid #eef2f1;cursor:pointer;}
  .picker-list .item:hover{background:var(--teal-050);}
  .picker-list .item.active{background:var(--teal-600);color:#fff;font-weight:600;}
  .picker-list .empty{padding:30px 10px;text-align:center;color:var(--ink-400);font-size:12.5px;}
  .picker-list .item .sub{display:inline;color:var(--ink-400);font-size:11px;margin-top:0;}

  .branch-manager{border:1px solid var(--border);border-radius:10px;padding:14px 16px;background:#fbfdfc;}
  .branch-manager h4{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-600);margin:0 0 2px;}
  .branch-manager .hint-inline{text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink-400);}
  .branch-chip-row{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 12px;}
  .branch-chip{padding:6px 12px;border-radius:20px;border:1px solid var(--border);background:#fff;font-size:12.5px;cursor:pointer;color:var(--ink-600);}
  .branch-chip:hover{background:var(--teal-050);}
  .branch-chip.active{background:var(--teal-600);border-color:var(--teal-600);color:#fff;font-weight:600;}
  .branch-form-row{display:grid;grid-template-columns:1.2fr 1fr 1fr auto auto auto;gap:8px;align-items:center;}
  .branch-form-row select, .branch-form-row input{padding:8px 10px;border:1px solid var(--border);border-radius:7px;background:#fff;font-size:12.5px;}
  @media (max-width:760px){ .branch-form-row{grid-template-columns:1fr 1fr;} }
  .picker-btns{display:flex;gap:7px;margin-top:8px;}

  .selected-devices{border:1px solid var(--border);border-radius:8px;padding:10px 12px;background:#fbfdfc;margin-bottom:16px;max-height:130px;overflow:auto;}
  .selected-devices .row{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0;border-bottom:1px dashed #e4ebe9;}
  .selected-devices .row:last-child{border-bottom:none;}

  .toast-wrap{position:fixed;top:18px;right:18px;display:flex;flex-direction:column;gap:8px;z-index:200;}
  .toast{padding:11px 16px;border-radius:99px;font-size:13px;font-weight:600;color:#fff;box-shadow:0 8px 20px rgba(0,0,0,.15);
    animation:slidein .18s ease-out;max-width:320px;}
  .toast.ok{background:var(--ok);} .toast.warn{background:var(--warn);} .toast.danger{background:var(--danger);}
  @keyframes slidein{from{transform:translateX(20px);opacity:0;}to{transform:translateX(0);opacity:1;}}
  @media (prefers-reduced-motion: reduce){ .toast{animation:none;} }

  .printer-select-item {
    display: flex;
    align-items: center;
    padding: 10px;
    border-bottom: 1px solid var(--border);
    gap: 12px;
  }
  .printer-select-item:last-child { border-bottom: none; }
  .printer-select-item input[type="radio"] { width: 18px; height: 18px; cursor: pointer; }

  @media (max-width:980px){
    .filters{grid-template-columns:repeat(2,1fr);}
    .grid-2{grid-template-columns:1fr;}
    .picker-cols{grid-template-columns:1fr;}
  }
  @media (max-width:760px){
    .app{flex-direction:column;}
    .sidebar{width:100%;flex-direction:row;overflow-x:auto;padding:12px;align-items:center;}
    .brand{padding:0 12px 0 0;}
    .nav{flex-direction:row;}
    .donate-box, .sidebar-footer, .current-user-box{display:none;}
    .content{padding:18px;}
  }

  /* ===== QR Code ===== */
  .qr-modal-body{display:flex;flex-direction:column;align-items:center;gap:16px;padding:10px 0;}
  .qr-canvas-wrap{border:1.5px solid var(--border);border-radius:12px;padding:16px;background:#fff;display:inline-flex;}
  .qr-info{width:100%;background:var(--bg);border-radius:10px;padding:14px 16px;font-size:13px;line-height:1.8;}
  .qr-info .row{display:flex;gap:8px;} .qr-info .lbl{color:var(--ink-400);min-width:120px;font-weight:600;}
  .qr-info .val{color:var(--ink-900);font-weight:500;}
  .qr-print-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;padding:16px;}
  .qr-card{border:1.5px solid #ccc;border-radius:10px;padding:14px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;break-inside:avoid;background:#fff;}
  .qr-card .qr-asset{font-weight:800;font-size:13px;color:#0d2836;letter-spacing:.04em;}
  .qr-card .qr-sub{font-size:10.5px;color:#4b6266;text-align:center;line-height:1.4;}
  .qr-card .qr-wrap{border:1px solid #e4ebe9;border-radius:8px;padding:8px;background:#fff;}
  @media print{
    .qr-print-header{margin-bottom:14px;}
    .qr-print-grid{gap:10px;padding:0;}
    .qr-card{page-break-inside:avoid;border:1px solid #bbb;}
  }
</style>

const NAV_ITEMS = [
  {id:'dashboard', label:'Dashboard', ic:'📊'},
  {id:'devices', label:'Thiết bị', ic:'💻'},
  {id:'users', label:'Người dùng', ic:'👥'},
  {id:'warehouse', label:'Kho', ic:'📦'},
  {id:'allocation', label:'Quản lý cấp phát', ic:'🔄'},
  {id:'maintenance', label:'Bảo trì & Sửa chữa', ic:'🛠️'},
  {id:'audit', label:'Kiểm kê', ic:'📋'},

  {id:'settings', label:'Hệ thống', ic:'⚙️'},
];

function genId(){ return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
/* LƯU Ý: dùng new Date().toISOString() để lấy ngày/tháng hiện tại là SAI ở các
   múi giờ trước UTC+0 lùi về (VD Việt Nam UTC+7): toISOString() quy đổi sang
   giờ UTC trước, nên có thể lùi lại 1 ngày (đầu giờ sáng) hoặc thậm chí luôn
   lùi 1 tháng khi tính mốc "ngày 1 đầu tháng" lúc 00:00 giờ địa phương. Dùng
   2 hàm bên dưới để lấy đúng ngày/tháng theo giờ địa phương của máy người dùng. */
function ymdLocal(d){
  d = d || new Date();
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  return `${d.getFullYear()}-${mm}-${dd}`;
}
function ymLocal(d){
  d = d || new Date();
  const mm = String(d.getMonth()+1).padStart(2,'0');
  return `${d.getFullYear()}-${mm}`;
}
function todayISO(){ return ymdLocal(); }

/* ---- Người dùng helpers ---- */
function userById(id){ return (state.users||[]).find(u=>u.id===id); }
function userName(id){ const u=userById(id); return u ? u.fullName : '—'; }
function userDept(id){ const u=userById(id); return u && u.deptId ? deptName(u.deptId) : '—'; }
function userPos(id){ const u=userById(id); return u && u.deptId && u.posId ? posName(u.deptId, u.posId) : '—'; }
function userOptions(selectedId, filterDeptId){
  const list = (state.users||[]).filter(u=> !filterDeptId || u.deptId===filterDeptId);
  const opts = `<option value="">-- Không chỉ định người dùng --</option>` +
    list.map(u=>`<option value="${u.id}" ${u.id===selectedId?'selected':''}>${escapeHtml(u.fullName)}${u.deptId ? ' ('+escapeHtml(deptName(u.deptId))+')' : ''}</option>`).join('');
  return opts;
}

/* Dùng khi dept/vị trí thay đổi trong form: lọc danh sách người dùng theo
   đúng Phòng/Ban + Vị trí cụ thể (không chỉ theo phòng/ban như trước), giữ
   lại giá trị đã chọn chỉ khi user đó vẫn khớp đúng vị trí mới */
function refreshedUserOptions(deptId, posId, prevSelectedId){
  const list = deptId && posId
    ? (state.users||[]).filter(u=> u.deptId === deptId && u.posId === posId)
    : deptId
      ? (state.users||[]).filter(u=> u.deptId === deptId)
      : (state.users||[]);
  // giữ lại selection cũ chỉ khi user đó có trong danh sách mới
  const keepSel = prevSelectedId && list.some(u=> u.id === prevSelectedId) ? prevSelectedId : '';
  const label = deptId && posId
    ? '-- Chọn người dùng thuộc vị trí này --'
    : deptId
      ? '-- Chọn vị trí cụ thể trước --'
      : '-- Không chỉ định người dùng --';
  const noUserRow = list.length === 0 && deptId && posId
    ? `<option value="" disabled>(Vị trí này chưa có người dùng nào)</option>`
    : `<option value="">${escapeHtml(label)}</option>`;
  return noUserRow +
    list.map(u=>`<option value="${u.id}" ${u.id===keepSel?'selected':''}>${escapeHtml(u.fullName)}${u.position?' — '+escapeHtml(u.position):''}</option>`).join('');
}
function fmtDate(iso){ if(!iso) return '–'; const p=iso.split('-'); if(p.length!==3) return iso; return `${p[2]}/${p[1]}/${p[0]}`; }
function fmtDateTimeMs(ms){ if(!ms) return '–'; const d=new Date(ms); return d.toLocaleString('vi-VN'); }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function val(id){ const el=document.getElementById(id); return el ? el.value.trim() : ''; }
function fmtMoney(n){ n=Number(n)||0; return n.toLocaleString('vi-VN')+' đ'; }

/* ============================= BACKEND API CLIENT ============================= */
async function api(method, path, body){
  const opts = { method, headers:{} };
  if(authToken) opts.headers['Authorization'] = 'Bearer '+authToken;
  if(body!==undefined){ opts.headers['Content-Type']='application/json'; opts.body=JSON.stringify(body); }
  let res;
  try{
    res = await fetch(path, opts);
  }catch(e){
    toast('Không thể kết nối tới server backend. Hãy chắc chắn server.py đang chạy.', 'danger');
    throw e;
  }
  let data = null;
  try{ data = await res.json(); }catch(e){ data = null; }
  if(res.status===401 && data && data.authRequired){
    clearSession();
    renderLoginScreen('Phiên đăng nhập đã hết hạn, vui lòng đăng nhập lại.');
    throw new Error('auth required');
  }
  if(!res.ok){
    toast((data && data.error) ? data.error : `Lỗi server (${res.status})`, 'danger');
    throw new Error((data && data.error) || 'request failed');
  }
  return data;
}
async function refreshState(){
  state = await api('GET', '/api/bootstrap');
}
async function loadState(){
  try{
    state = await api('GET', '/api/bootstrap');
  }catch(e){
    if(!authToken) return; // đang ở màn hình đăng nhập, không phải lỗi kết nối
    document.getElementById('content').innerHTML = `
      <div class="card">
        <h3>Không kết nối được tới backend</h3>
        <div class="hint">Hãy chạy <code>python3 server.py</code> trong thư mục ứng dụng rồi tải lại trang này (http://127.0.0.1:8877/).</div>
      </div>`;
    return;
  }
  renderNav();
  renderCurrentUserBox();
  render();
}

/* ============================= ĐĂNG NHẬP ============================= */
let authToken = sessionStorage.getItem('qltb_token') || null;
let currentAccount = JSON.parse(sessionStorage.getItem('qltb_account') || 'null');

function clearSession(){
  authToken = null; currentAccount = null;
  sessionStorage.removeItem('qltb_token');
  sessionStorage.removeItem('qltb_account');
}
function saveSession(token, account){
  authToken = token; currentAccount = account;
  sessionStorage.setItem('qltb_token', token);
  sessionStorage.setItem('qltb_account', JSON.stringify(account));
}
const ACCOUNT_ROLE_LABELS_LOGIN = {admin:'Quản trị viên', staff:'Nhân viên', viewer:'Chỉ xem'};

/* ============================= PHÂN QUYỀN (UI) =============================
   Ẩn/khoá giao diện theo đúng ma trận phân quyền admin cấu hình. Đây chỉ là
   lớp trải nghiệm — việc chặn thật sự (bắt buộc) luôn nằm ở server.py, nên
   dù người dùng cố tình sửa JS hay gọi thẳng API, thao tác vẫn bị từ chối. */
const PERM_RANK = {none:0, view:1, edit:2};
function myPermLevel(mod){
  if(!currentAccount) return 'none';
  if(currentAccount.role === 'admin') return 'edit';
  const table = (state && state.permissions) || {};
  const roleTable = table[currentAccount.role] || {};
  return roleTable[mod] || 'none';
}
function canView(mod){ return PERM_RANK[myPermLevel(mod)] >= PERM_RANK.view; }
function canEdit(mod){ return PERM_RANK[myPermLevel(mod)] >= PERM_RANK.edit; }
function isAdmin(){ return !!(currentAccount && currentAccount.role==='admin'); }
function requireEdit(mod, msg){
  if(canEdit(mod)) return true;
  toast(msg || 'Bạn không có quyền thực hiện thao tác này.', 'warn');
  return false;
}
/* Nút chỉ hiện khi đủ quyền "edit" trên module — dùng thay cho việc gõ tay
   thẻ <button> ở những chỗ tạo/sửa/xoá, để không lộ hành động mà tài khoản
   không được phép làm. */
function editOnly(mod, html){ return canEdit(mod) ? html : ''; }

  try{
    const res = await fetch('/api/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({username, password})
    });
    const data = await res.json().catch(()=>null);
    if(!res.ok){
      errBox.textContent = (data && data.error) || 'Đăng nhập thất bại';
      errBox.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Đăng nhập';
      return false;
    }
    saveSession(data.token, data.account);
    const loginRoot = document.getElementById('loginRoot');
    if(loginRoot) loginRoot.innerHTML = '';
    document.querySelector('.app').classList.add('visible');
    await loadState();
    toast(`Xin chào ${data.account.fullName || data.account.username}!`, 'ok');
  }catch(e){
    errBox.textContent = 'Không thể kết nối tới server backend.';
    errBox.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Đăng nhập';
  }
  return false;
}
async function doLogout(){
  if(!confirm('Đăng xuất khỏi hệ thống?')) return;
  try{ await api('POST', '/api/logout', {}); }catch(e){}
  clearSession();
  renderLoginScreen();
}
function renderCurrentUserBox(){

/* ============================= LOOKUPS ============================= */
function deptById(id){ return state.departments.find(d=>d.id===id); }
function posById(deptId,posId){ const d=deptById(deptId); return d ? d.positions.find(p=>p.id===posId) : null; }
function groupById(id){ return state.groups.find(g=>g.id===id); }
function typeById(groupId,typeId){ const g=groupById(groupId); return g ? g.types.find(t=>t.id===typeId) : null; }
function deptName(id){ const d=deptById(id); return d? d.name : '—'; }
function posName(deptId,posId){ const p=posById(deptId,posId); return p? p.name : '—'; }
/* Lịch sử cấp phát/điều chuyển lưu vị trí dưới dạng "deptId/posId" —
   hàm này dịch lại thành "Tên phòng ban / Tên vị trí" để hiển thị. */
function locationLabel(loc){
  if(!loc) return '—';
  const parts = String(loc).split('/');
  const deptId = parts[0] || '';
  const posId = parts[1] || '';
  if(!deptId) return '—';
  const dn = deptName(deptId);
  const pn = posId ? posName(deptId, posId) : '';
  return (pn && pn !== '—') ? `${dn} / ${pn}` : dn;
}
function branchById(id){ return (state.branches||[]).find(b=>b.id===id); }
function branchName(id){ if(!id) return '—'; const b=branchById(id); return b? b.name : '—'; }
function groupName(id){ const g=groupById(id); return g? g.name : '—'; }
function typeName(gid,tid){ const t=typeById(gid,tid); return t? t.name : '—'; }

function initials(str){ return (str||'').split(/\s+/).filter(Boolean).map(w=>w[0]).join('').toUpperCase(); }
function genAssetCode(typeNm){
  let prefix = initials(typeNm).slice(0,3) || 'TB';
  const yy = new Date().getFullYear().toString().slice(-2);
  const key = prefix+yy;
  const currentCount = (state.counters && state.counters.asset && state.counters.asset[key]) || 0;
  const num = String(currentCount + 1).padStart(4,'0');
  return `${prefix}-${yy}${num}`;
}

function warrantyStatus(dev){
  if(!dev.warrantyMonths) return {label:'N/A', cls:'muted'};
  const base = new Date(dev.importDate);
  if(isNaN(base.getTime())) return {label:'N/A', cls:'muted'};
  const months = dev.warrantyUnit==='Năm' ? Number(dev.warrantyMonths)*12 : Number(dev.warrantyMonths);
  const expiry = new Date(base); expiry.setMonth(expiry.getMonth()+months);
  const now = new Date();
  const diffDays = Math.floor((expiry-now)/86400000);
  if(diffDays<0) return {label:'Hết bảo hành', cls:'danger'};
  if(diffDays<=30) return {label:'Sắp hết bảo hành', cls:'warn'};
  return {label:'Bảo hành', cls:'ok'};
}
function statusBadgeClass(status){
  if(status==='Bình thường') return 'ok';
  if(status==='Cần bảo trì') return 'warn';
  if(status==='Hỏng - chờ sửa') return 'danger';
  if(status==='Chờ thanh lý') return 'warn';
  return 'muted';
}

/* ============================= TOAST ============================= */
function toast(msg, type){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast '+(type||'ok');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>el.remove(), 3200);
}

/* ============================= NAV / RENDER ============================= */
function visibleNavItems(){
  return NAV_ITEMS.filter(n => canView(n.id));
}
function renderNav(){
  const nav = document.getElementById('navList');
  nav.innerHTML = visibleNavItems().map(n=>`
    <button type="button" class="nav-item ${ui.view===n.id?'active':''}" onclick="switchView('${n.id}')">
      <span class="ic">${n.ic}</span><span>${n.label}</span>
    </button>`).join('');
}
function switchView(v){
  if(!canView(v)){
    toast('Bạn không có quyền truy cập mục này.', 'warn');
    const allowed = visibleNavItems();
    v = allowed.length ? allowed[0].id : v;
  }
  ui.view = v;
  ui.selectedDeviceIds.clear();
  ui.selectedHistoryIds.clear();
  ui.selectedLogIds.clear();
  ui.page = 1;
  renderNav();
  render();
  if(v==='reports' && ui.reportsTab==='stats') loadStats();
  if(v==='audit'){
    ui.auditSubView = 'list'; ui.auditBatchId = null; _auditDetail = null;
    loadAuditBatches();
  }
}

/* ============================= GROUPED MENU WRAPPERS ============================= */
function groupTabs(items, activeId, onClickFn){
  return `<div class="tabs">${items.map(it=>`
    <button type="button" class="tab ${activeId===it.id?'active':''}" onclick="${onClickFn}('${it.id}')">${it.ic?it.ic+' ':''}${escapeHtml(it.label)}</button>`).join('')}</div>`;
}
function comingSoonView(icon, title, desc, note){
  return `
  <div class="page-head"><div><h1>${icon} ${escapeHtml(title)}</h1><div class="desc">${escapeHtml(desc)}</div></div></div>
  <div class="card" style="text-align:center; padding:48px 20px;">
    <div style="font-size:40px; margin-bottom:10px;">🚧</div>
    <h3 style="margin-bottom:6px;">Tính năng đang được phát triển</h3>
    <div class="hint" style="max-width:520px; margin:0 auto;">${escapeHtml(note)}</div>
  </div>`;
}

/* ---- Thiết bị (Nhập liệu / Danh sách / Check bản quyền) ---- */
function renderDevicesGroupView(){
  const tab = (ui.devicesTab && (ui.devicesTab!=='entry' || canEdit('devices'))) ? ui.devicesTab : 'list';
  const tabItems = [
    {id:'entry', label:'Nhập liệu', ic:'✎'},
    {id:'list', label:'Danh sách TB', ic:'📋'},
    {id:'license', label:'Check Bản quyền', ic:'🛡️'},
  ].filter(t => t.id!=='entry' || canEdit('devices'));
  const tabsHtml = groupTabs(tabItems, tab, 'setDevicesTab');
  let body;
  if(tab==='entry') body = renderDataEntryView();
  else if(tab==='license') body = renderLicenseCheckView();
  else body = renderDeviceListView();
  return tabsHtml + body;
}
function setDevicesTab(t){
  ui.devicesTab = t;
  ui.selectedDeviceIds.clear();
  ui.page = 1;
  render();
}

/* ---- Quản lý cấp phát (Cấp phát / Thu hồi / Điều chuyển / Mượn-Trả) ---- */
function renderAllocationGroupView(){
  const tab = ui.allocationTab || 'all';
  const tabsHtml = groupTabs([
    {id:'all', label:'Tất cả', ic:''},
    {id:'handover', label:'Cấp phát', ic:'📦'},
    {id:'reclaim', label:'Thu hồi', ic:'↩️'},
    {id:'transfer', label:'Điều chuyển', ic:'⇆'},
    {id:'borrow', label:'Mượn/Trả', ic:'🤝'},
  ], tab, 'setAllocationTab');
  let body;
  if(tab==='borrow'){
    body = renderBorrowView();
  } else {
    body = renderHistoryView(tab);
  }
  return tabsHtml + body;
}
function setAllocationTab(t){
  ui.allocationTab = t;
  ui.selectedHistoryIds.clear();
  render();
}

/* ---- Báo cáo (Thống kê / Xuất báo cáo) ---- */
function renderReportsGroupView(){
  const tab = ui.reportsTab || 'stats';

    {id:'export', label:'Xuất báo cáo', ic:'📄'},

/* ---- Kho (Nhập kho / Xuất kho / Tồn kho) ---- */
function warehouseDept(){ return (state.departments||[]).find(d=>d.name==='Kho') || null; }
function warehousePos(){ const d=warehouseDept(); if(!d) return null; return d.positions.find(p=>p.name==='Kho') || d.positions[0] || null; }
function warehouseDeviceList(){
  const d=warehouseDept(), p=warehousePos();
  if(!d || !p) return [];
  return (state.devices||[]).filter(dv=>dv.deptId===d.id && dv.posId===p.id);
}
function materialById(id){ return (state.materials||[]).find(m=>m.id===id); }
function materialName(id){ const m=materialById(id); return m ? m.name : '—'; }
function materialStock(id){
  return (state.materialTxns||[]).reduce((s,t)=>{
    if(t.materialId!==id) return s;
    return s + (t.type==='nhap' ? Number(t.quantity)||0 : -(Number(t.quantity)||0));
  }, 0);
}
function materialOptionsAll(selectedId){
  const list = state.materials || [];
  if(!list.length) return `<option value="">-- Chưa có vật tư, hãy thêm mới --</option>`;
  return `<option value="">-- Chọn vật tư --</option>` +
    list.map(m=>`<option value="${m.id}" ${m.id===selectedId?'selected':''}>${escapeHtml(m.name)} (Tồn: ${materialStock(m.id)} ${escapeHtml(m.unit||'')})</option>`).join('');
}
function renderWarehouseView(){
  const tab = ui.warehouseTab || 'nhap';
  const tabsHtml = groupTabs([
    {id:'nhap', label:'Nhập kho', ic:'⬇️'},
    {id:'xuat', label:'Xuất kho', ic:'⬆️'},
    {id:'ton', label:'Tồn kho', ic:'📦'},
  ], tab, 'setWarehouseTab');
  let body;
  if(tab==='xuat') body = renderWarehouseXuatView();
  else if(tab==='ton') body = renderWarehouseTonView();
  else body = renderWarehouseNhapView();
  return tabsHtml + body;
}
function setWarehouseTab(t){
  ui.warehouseTab = t;
  ui.selectedDeviceIds.clear();
  render();
}
function materialTxnRows(type, limit){
  let items = (state.materialTxns||[]).filter(t=>t.type===type);
  if(limit) items = items.slice(0, limit);
  if(!items.length) return `<tr class="empty-row"><td colspan="7">${type==='nhap'?'Chưa có phiếu nhập kho vật tư':'Chưa có phiếu xuất kho vật tư'}</td></tr>`;
  return items.map(t=>`
    <tr>
      <td>${fmtDate(t.date)}</td>
      <td class="mono">${escapeHtml(t.code)}</td>
      <td>${escapeHtml(t.materialName)}</td>
      <td>${t.quantity} ${escapeHtml(t.unit)}</td>
      <td>${type==='nhap' ? (escapeHtml(t.supplier)||'—') : (t.deptId ? escapeHtml(deptName(t.deptId))+' / '+escapeHtml(posName(t.deptId,t.posId)) : '—')}</td>
      <td>${escapeHtml(type==='nhap' ? t.performer : t.reason) || '—'}</td>
      <td>${editOnly('warehouse', `<button type="button" class="btn btn-danger btn-xs" title="Xóa" onclick="deleteMaterialTxn('${t.id}')">&#128465;</button>`)}</td>
    </tr>`).join('');
}

  <div class="grid-2">

async function submitMaterialNhap(){
  if(!requireEdit('warehouse')) return;
  const materialId = val('nk_material'), qty = Number(val('nk_qty'));
  if(!materialId){ toast('Vui lòng chọn vật tư', 'warn'); return; }
  if(!qty || qty<=0){ toast('Vui lòng nhập số lượng hợp lệ', 'warn'); return; }
  const payload = {
    type:'nhap', materialId, quantity: qty, date: val('nk_date')||todayISO(),
    supplier: val('nk_supplier'), performer: val('nk_performer'), note: val('nk_note'),
  };
  try{ await api('POST', '/api/material-txn', payload); }catch(e){ return; }
  await refreshState(); toast('Đã ghi nhận nhập kho vật tư', 'ok'); render();
}
async function submitMaterialXuat(){
  if(!requireEdit('warehouse')) return;
  const materialId = val('xk_material'), qty = Number(val('xk_qty'));
  if(!materialId){ toast('Vui lòng chọn vật tư', 'warn'); return; }
  if(!qty || qty<=0){ toast('Vui lòng nhập số lượng hợp lệ', 'warn'); return; }
  const stock = materialStock(materialId);
  if(qty>stock){ toast(`Số lượng xuất (${qty}) vượt quá tồn kho hiện có (${stock})`, 'warn'); return; }
  const payload = {
    type:'xuat', materialId, quantity: qty, date: val('xk_date')||todayISO(),
    deptId: val('xk_dept'), posId: val('xk_pos'), reason: val('xk_reason'),
    performer: val('xk_performer'), note: val('xk_note'),
  };
  try{ await api('POST', '/api/material-txn', payload); }catch(e){ return; }
  await refreshState(); toast('Đã ghi nhận xuất kho vật tư', 'ok'); render();
}
async function deleteMaterialTxn(id){
  if(!requireEdit('warehouse')) return;
  if(!confirm('Xóa phiếu này? Tồn kho sẽ được tính lại tự động.')) return;
  try{ await api('POST', '/api/material-txn/delete', {ids:[id]}); }catch(e){ return; }
  await refreshState(); toast('Đã xóa phiếu', 'ok'); render();
}
async function submitWarehouseDevice(){
  if(!requireEdit('devices')) return;
  const groupId = val('wh_group'), typeId = val('wh_type');
  if(!groupId || !typeId){ toast('Vui lòng chọn nhóm và loại thiết bị', 'warn'); return; }
  const d = warehouseDept(), p = warehousePos();
  if(!d || !p){ toast('Không tìm thấy phòng/ban Kho trong hệ thống', 'danger'); return; }
  const serialVal = val('wh_serial');
  if(serialVal){
    const isDup = state.devices.some(x=>(x.serial||'').trim().toLowerCase()===serialVal.toLowerCase());
    if(isDup){ toast(`Số Serial "${serialVal}" đã tồn tại trong hệ thống!`, 'danger'); return; }
  }
  const payload = {
    deptId: d.id, posId: p.id, groupId, typeId,
    model: val('wh_model'), manufacturer: val('wh_maker'), serial: serialVal,
    status: 'Bình thường', importDate: val('wh_import')||todayISO(),
    warrantyMonths: val('wh_warranty'), warrantyUnit: val('wh_warrantyUnit'),
    supplier: val('wh_supplier'), value: Number(val('wh_value'))||0, note: val('wh_note'),
  };
  try{ await api('POST', '/api/devices', payload); }catch(e){ return; }
  await refreshState(); toast('Đã nhập thiết bị vào kho', 'ok'); render();
}

async function saveMaterialForm(){
  if(!requireEdit('warehouse')) return;
  const name = val('mm_name');
  if(!name){ toast('Vui lòng nhập tên vật tư', 'warn'); return; }
  const payload = { name, code: val('mm_code'), category: val('mm_category'), unit: val('mm_unit'),
    minStock: Number(val('mm_minstock'))||0, note: val('mm_note') };
  let saved;
  try{
    if(ui.settingsMaterialSel) saved = await api('PUT', '/api/materials/'+ui.settingsMaterialSel, payload);
    else saved = await api('POST', '/api/materials', payload);
  }catch(e){ return; }
  await refreshState(); ui.settingsMaterialSel = saved.id; refreshMaterialModal();
  toast(ui.settingsMaterialSel ? 'Đã lưu vật tư' : 'Đã thêm vật tư', 'ok');
}
async function deleteMaterialForm(){
  if(!requireEdit('warehouse')) return;
  const list = state.materials || [];
  const sel = list.find(m=>m.id===ui.settingsMaterialSel);
  if(!sel){ toast('Vui lòng chọn một vật tư', 'warn'); return; }
  if(!confirm(`Xóa vật tư "${sel.name}"? Lịch sử nhập/xuất liên quan vẫn được giữ lại.`)) return;
  try{ await api('POST', '/api/materials/delete', {ids:[sel.id]}); }catch(e){ return; }
  await refreshState();
  ui.settingsMaterialSel = (state.materials && state.materials.length) ? state.materials[0].id : null;
  refreshMaterialModal();
  toast('Đã xóa vật tư', 'ok');
}

const MAINTENANCE_TYPE_LABELS = { baotri: 'Bảo trì định kỳ', suachua: 'Sửa chữa' };
const MAINTENANCE_STATUS_LABELS = { dangxuly: 'Đang xử lý', hoanthanh: 'Hoàn thành', huy: 'Đã hủy' };
function maintenanceTypeLabel(t){ return MAINTENANCE_TYPE_LABELS[t] || t || '—'; }
function maintenanceStatusLabel(s){ return MAINTENANCE_STATUS_LABELS[s] || s || '—'; }
function maintenanceStatusBadgeClass(s){
  if(s==='dangxuly') return 'warn';
  if(s==='hoanthanh') return 'ok';
  if(s==='huy') return 'muted';
  return 'muted';
}
function maintenanceDeviceLabel(d){
  if(!d) return '—';
  return `${d.assetCode} — ${typeName(d.groupId,d.typeId)}`;
}
function deviceOptionsAll(selectedId){
  const list = (state.devices||[]).slice().sort((a,b)=> (a.assetCode||'').localeCompare(b.assetCode||''));
  if(!list.length) return `<option value="">-- Chưa có thiết bị nào --</option>`;
  return `<option value="">-- Chọn thiết bị --</option>` +
    list.map(d=>`<option value="${d.id}" ${d.id===selectedId?'selected':''}>${escapeHtml(d.assetCode)} — ${escapeHtml(typeName(d.groupId,d.typeId))} (${escapeHtml(deptName(d.deptId))})</option>`).join('');
}
function maintenanceById(id){ return (state.maintenance||[]).find(x=>x.id===id); }
function setMaintenanceTab(t){ ui.maintenanceTab = t; render(); }

function renderMaintenanceView(){
  const tabsHtml = groupTabs([
    {id:'all', label:'Tất cả', ic:''},
    {id:'dangxuly', label:'Đang xử lý', ic:'🛠️'},
    {id:'hoanthanh', label:'Hoàn thành', ic:'✅'},
    {id:'huy', label:'Đã hủy', ic:'✕'},
  ], ui.maintenanceTab||'all', 'setMaintenanceTab');

  let items = (state.maintenance||[]).slice();
  if(ui.maintenanceTab && ui.maintenanceTab!=='all') items = items.filter(x=>x.status===ui.maintenanceTab);
  if(ui.maintenanceFilterType) items = items.filter(x=>x.type===ui.maintenanceFilterType);
  const search = (ui.maintenanceFilterSearch||'').toLowerCase();
  if(search){
    items = items.filter(x=>{
      const dev = (state.devices||[]).find(d=>d.id===x.deviceId);
      const hay = `${x.code} ${x.issue} ${x.performer} ${dev?dev.assetCode:''}`.toLowerCase();
      return hay.includes(search);
    });
  }

  const rows = items.map(x=>{
    const dev = (state.devices||[]).find(d=>d.id===x.deviceId);
    const actions = [];
    if(x.status==='dangxuly'){
      actions.push(editOnly('maintenance', `<button type="button" class="btn btn-outline btn-xs" title="Sửa" onclick="openMaintenanceModal('${x.id}')">&#9998;</button>`));
      actions.push(editOnly('maintenance', `<button type="button" class="btn btn-teal btn-xs" title="Hoàn thành" onclick="openMaintenanceCompleteModal('${x.id}')">&#10003; Hoàn thành</button>`));
      actions.push(editOnly('maintenance', `<button type="button" class="btn btn-outline btn-xs" title="Hủy phiếu" onclick="cancelMaintenanceTicket('${x.id}')">Hủy</button>`));
    }
    actions.push(editOnly('maintenance', `<button type="button" class="btn btn-danger btn-xs" title="Xóa" onclick="deleteMaintenanceTicket('${x.id}')">&#128465;</button>`));
    return `
    <tr>
      <td class="mono">${escapeHtml(x.code)}</td>
      <td><b>${escapeHtml(dev?dev.assetCode:'—')}</b><span class="sub">${dev?escapeHtml(typeName(dev.groupId,dev.typeId)):''}</span></td>
      <td><span class="badge ${x.type==='baotri'?'warn':'danger'}">${maintenanceTypeLabel(x.type)}</span></td>

async function submitMaintenance(){
  if(!requireEdit('maintenance')) return;
  const editingId = ui.editingMaintenanceId;
  const issue = val('mt_issue');
  if(!issue){ toast('Vui lòng nhập nội dung / mô tả sự cố', 'warn'); return; }
  const payload = {
    type: val('mt_type'), issue, expectedDate: val('mt_expected'),
    performer: val('mt_performer'), note: val('mt_note'),
  };
  try{
    if(editingId){
      await api('PUT', '/api/maintenance/'+editingId, payload);
    } else {
      const deviceId = val('mt_device');
      if(!deviceId){ toast('Vui lòng chọn thiết bị', 'warn'); return; }
      payload.deviceId = deviceId;
      payload.startDate = val('mt_start') || todayISO();
      await api('POST', '/api/maintenance', payload);
    }
  }catch(e){ return; }
  await refreshState(); closeModal(); ui.editingMaintenanceId = null;
  toast(editingId ? 'Đã cập nhật phiếu' : 'Đã tạo phiếu bảo trì / sửa chữa', 'ok'); render();
}

  if(ui.view==='audit' && ui.auditSubView==='list') render();
}
async function loadAuditDetail(id){
  try{ _auditDetail = await api('GET','/api/audit/batches/'+id); }
  catch(e){ _auditDetail = null; }
  if(ui.view==='audit' && ui.auditSubView==='detail') render();
}

function auditStatusBadge(status){
  const map = {active:['warn','Đang tiến hành'], completed:['ok','Hoàn thành'], cancelled:['muted','Đã hủy']};
  const [cls,label] = map[status] || ['muted', status];
  return `<span class="badge ${cls}">${label}</span>`;
}
function auditScopeLabel(b){
  if(b.scopeType==='department') return `Phòng/Ban: ${escapeHtml(deptName(b.scopeDeptId))}`;
  if(b.scopeType==='group') return `Nhóm TB: ${escapeHtml(groupName(b.scopeGroupId))}`;
  return 'Toàn bộ hệ thống';
}
function isOverdue(b){
  return b.status==='active' && b.dueDate && b.dueDate < todayISO();
}

function renderAuditView(){
  if(ui.auditSubView==='detail' && ui.auditBatchId){
    return renderAuditBatchDetail();
  }
  return renderAuditBatchList();
}

/* ---- Danh sách các đợt kiểm kê ---- */
function renderAuditBatchList(){
  const rows = _auditBatches.map(b=>{
    const c = b.counts || {};
    const pct = c.plannedTotal ? Math.round(((c.matched||0)+(c.mismatch||0))/c.plannedTotal*100) : 0;
    return `<tr style="cursor:pointer;" onclick="openAuditBatch('${b.id}')">
      <td><b>${escapeHtml(b.name)}</b><div class="sub" style="color:var(--ink-400);font-size:11px;">${escapeHtml(b.code)}</div></td>
      <td>${auditScopeLabel(b)}</td>
      <td>${auditStatusBadge(b.status)} ${isOverdue(b)?'<span class="badge danger" style="margin-left:4px;">Quá hạn</span>':''}</td>
      <td>
        <div style="display:flex;align-items:center;gap:8px;">
          <div style="flex:1;background:var(--bg);border-radius:6px;height:8px;overflow:hidden;min-width:70px;">
            <div style="height:100%;background:var(--teal-500);width:${pct}%;"></div>
          </div>
          <span style="font-size:11.5px;color:var(--ink-400);">${(c.matched||0)+(c.mismatch||0)}/${c.plannedTotal||0}</span>
        </div>
      </td>
      <td style="font-size:12px;">${b.dueDate?fmtDate(b.dueDate):'—'}</td>
      <td style="font-size:12px;color:var(--ink-400);">${escapeHtml(b.createdBy)}</td>
    </tr>`;
  }).join('');
  return `
  <div class="page-head"><div><h1>📋 Kiểm kê thiết bị</h1><div class="desc">Kiểm kê theo từng đợt — quét mã QR để đối chiếu, xuất biên bản chênh lệch khi hoàn tất</div></div>
    <div class="head-actions"><button class="btn btn-teal" onclick="openCreateAuditBatchModal()">➕ Tạo đợt kiểm kê</button></div>
  </div>
  <div class="card" style="padding:0;"><div style="overflow-x:auto;">
    <table>
      <thead><tr><th>Đợt kiểm kê</th><th>Phạm vi</th><th>Trạng thái</th><th>Tiến độ</th><th>Hạn hoàn thành</th><th>Người tạo</th></tr></thead>
      <tbody>${rows || `<tr class="empty-row"><td colspan="6">Chưa có đợt kiểm kê nào. Nhấn "Tạo đợt kiểm kê" để bắt đầu.</td></tr>`}</tbody>
    </table>
  </div></div>`;
}

function openCreateAuditBatchModal(){
  openModal({
    title: '➕ Tạo đợt kiểm kê mới',
    body: `
      <div class="field"><label>Tên đợt <span class="req">*</span></label>
        <input id="ab_name" placeholder="VD: Kiểm kê Q3/2026 - Phòng Kế toán">
      </div>
      <div class="field"><label>Phạm vi kiểm kê <span class="req">*</span></label>
        <select id="ab_scope_type" onchange="onAuditScopeTypeChange()">
          <option value="all">Toàn bộ hệ thống</option>
          <option value="department">Theo Phòng/Ban</option>
          <option value="group">Theo Nhóm thiết bị</option>
        </select>
      </div>
      <div id="ab_scope_extra"></div>
      <div class="grid-2">
        <div class="field"><label>Hạn hoàn thành</label><input type="date" id="ab_due" min="${todayISO()}"></div>
      </div>
      <div class="field"><label>Ghi chú</label><input id="ab_note" placeholder="Ghi chú thêm (không bắt buộc)..."></div>
      <div class="hint" id="ab_scope_preview" style="margin-top:6px;"></div>
    `,
    foot: `<button class="btn btn-outline" onclick="closeModal()">Hủy</button>
           <button class="btn btn-teal" onclick="submitCreateAuditBatch()">✔ Tạo đợt &amp; chụp danh sách thiết bị</button>`
  });
  onAuditScopeTypeChange();
}
function onAuditScopeTypeChange(){
  const type = val('ab_scope_type');
  const el = document.getElementById('ab_scope_extra');
  if(type==='department'){
    el.innerHTML = `<div class="field"><label>Chọn Phòng/Ban <span class="req">*</span></label>
      <select id="ab_scope_dept" onchange="previewAuditScope()">${deptOptions('')}</select></div>`;
  } else if(type==='group'){
    el.innerHTML = `<div class="field"><label>Chọn Nhóm thiết bị <span class="req">*</span></label>
      <select id="ab_scope_group" onchange="previewAuditScope()">${groupOptionsAll('')}</select></div>`;
  } else {
    el.innerHTML = '';
  }
  previewAuditScope();
}
function previewAuditScope(){
  const type = val('ab_scope_type');
  let count = 0;
  if(type==='all') count = (state.devices||[]).length;
  else if(type==='department'){ const id=val('ab_scope_dept'); count = (state.devices||[]).filter(d=>d.deptId===id).length; }
  else if(type==='group'){ const id=val('ab_scope_group'); count = (state.devices||[]).filter(d=>d.groupId===id).length; }
  const prev = document.getElementById('ab_scope_preview');
  if(prev) prev.textContent = `📦 Phạm vi này hiện có ${count} thiết bị — danh sách sẽ được chụp lại tại thời điểm tạo đợt.`;
}
async function submitCreateAuditBatch(){
  const name = val('ab_name');
  if(!name){ toast('Vui lòng nhập tên đợt kiểm kê','warn'); return; }
  const scopeType = val('ab_scope_type');
  const payload = { name, scopeType, dueDate: val('ab_due'), note: val('ab_note'),
    scopeDeptId: scopeType==='department' ? val('ab_scope_dept') : '',
    scopeGroupId: scopeType==='group' ? val('ab_scope_group') : '' };
  let created;
  try{ created = await api('POST','/api/audit/batches',payload); }catch(e){ return; }
  closeModal();
  toast(`Đã tạo đợt "${created.name}" với ${created.counts.plannedTotal} thiết bị`, 'ok');
  await loadAuditBatches();
  openAuditBatch(created.id);
}

async function openAuditBatch(id){
  ui.auditBatchId = id; ui.auditSubView = 'detail';
  ui.auditScanDeptId = ''; ui.auditScanPosId = ''; ui.auditItemFilter = ''; ui.auditItemSearch = '';
  _auditLastScan = null;
  _auditDetail = null;
  render();
  await loadAuditDetail(id);
}
function backToAuditList(){
  ui.auditSubView = 'list'; ui.auditBatchId = null; _auditDetail = null;
  render();
}

/* ---- Chi tiết 1 đợt kiểm kê (quét + danh sách) ---- */
function renderAuditBatchDetail(){
  if(!_auditDetail){
    return `<div class="page-head"><div><h1>📋 Kiểm kê</h1></div></div><div class="card">Đang tải dữ liệu đợt kiểm kê...</div>`;
  }
  const b = _auditDetail;
  const c = b.counts || {};
  const isActive = b.status==='active';

  function statChip(label, val, cls){
    return `<div style="text-align:center;flex:1;min-width:86px;">
      <div style="font-size:20px;font-weight:800;color:var(--${cls||'ink-900'});">${val}</div>
      <div style="font-size:11px;color:var(--ink-400);">${label}</div>
    </div>`;
  }

  const scanPanel = isActive ? `
  <div class="card" style="border:1.5px solid var(--teal-500);">
    <h3>📷 Quét kiểm kê</h3>
    <div class="grid-2" style="margin-bottom:10px;">
      <div class="field"><label>Đang kiểm kê tại — Phòng/Ban</label>
        <select id="scan_dept" onchange="onAuditScanDeptChange()">${deptOptions(ui.auditScanDeptId)}</select>
      </div>
      <div class="field"><label>Vị trí cụ thể</label>
        <select id="scan_pos" onchange="ui.auditScanPosId=this.value;">${posOptionsFor(ui.auditScanDeptId, ui.auditScanPosId)}</select>
      </div>
    </div>
    <div class="field">
      <label>Quét mã QR / Nhập mã tài sản <span class="req">*</span></label>
      <input id="scan_input" placeholder="Quét bằng máy quét mã vạch, hoặc gõ mã tài sản rồi nhấn Enter..."
        autocomplete="off" onkeydown="if(event.key==='Enter'){ event.preventDefault(); submitAuditScan(); }"
        style="font-size:15px;padding:12px 14px;">
    </div>
    <button class="btn btn-teal" onclick="submitAuditScan()">✔ Xác nhận quét</button>
    ${_auditLastScan ? renderLastScanPanel() : ''}
  </div>` : `<div class="card" style="background:var(--bg);">
    <div class="hint">Đợt kiểm kê này đã ${b.status==='completed'?'hoàn thành':'bị hủy'} — không thể tiếp tục quét.</div>
  </div>`;

  const filterOpts = [
    ['', 'Tất cả'], ['pending','Chưa kiểm kê'], ['matched','Khớp'], ['mismatch','Lệch'],
    ['not_found','Không tìm thấy'], ['extra','Phát hiện thừa'],
  ];
  let items = (b.items||[]).filter(it=>{
    if(ui.auditItemFilter && it.scanStatus!==ui.auditItemFilter) return false;
    if(ui.auditItemSearch){
      const s = ui.auditItemSearch.toLowerCase();
      if(!(`${it.assetCode} ${it.model} ${it.deptName} ${it.posName}`).toLowerCase().includes(s)) return false;
    }
    return true;
  });
  const rows = items.map(it=>{
    const cls = {pending:'muted',matched:'ok',mismatch:'warn',not_found:'danger',extra:'warn'}[it.scanStatus]||'muted';
    const locFlag = it.locationMatch==='mismatch' ? ' <span class="badge warn" style="font-size:10px;">Lệch vị trí</span>' : '';
    const condFlag = it.conditionMatch==='mismatch' ? ' <span class="badge warn" style="font-size:10px;">Lệch tình trạng</span>' : '';
    return `<tr>
      <td class="mono">${escapeHtml(it.assetCode)}</td>
      <td>${escapeHtml(it.model||'—')}<div class="sub" style="font-size:11px;color:var(--ink-400);">${escapeHtml(it.typeName||'')}</div></td>
      <td>${escapeHtml(it.deptName||'—')}<div class="sub" style="font-size:11px;color:var(--ink-400);">${escapeHtml(it.posName||'')}</div></td>
      <td><span class="badge ${cls}">${escapeHtml(it.scanStatusLabel)}</span>${locFlag}${condFlag}</td>
      <td style="font-size:11.5px;color:var(--ink-400);">${it.scannedBy?escapeHtml(it.scannedBy)+' · '+fmtDateTimeMs(it.scannedAt):'—'}</td>
      <td>${isActive && it.scanStatus!=='pending' ? `<button class="btn btn-outline btn-sm" onclick="openAuditItemFix('${it.id}')">✏️ Ghi nhận lệch</button>` : ''}</td>
    </tr>`;
  }).join('');

  return `
  <div class="page-head">
    <div>
      <button class="btn btn-outline btn-sm" onclick="backToAuditList()" style="margin-bottom:8px;">← Danh sách đợt kiểm kê</button>
      <h1>📋 ${escapeHtml(b.name)}</h1>
      <div class="desc">${escapeHtml(b.code)} · ${auditScopeLabel(b)} · ${auditStatusBadge(b.status)}${isOverdue(b)?' <span class="badge danger">Quá hạn</span>':''}</div>
    </div>
    <div class="head-actions">
      ${isActive ? `<button class="btn btn-danger" onclick="cancelAuditBatch('${b.id}')">✖ Hủy đợt</button>
                    <button class="btn btn-primary" onclick="closeAuditBatch('${b.id}')">✔ Đóng đợt kiểm kê</button>` : ''}
      <button class="btn btn-outline" onclick="exportAuditReportPDF()">📄 Xuất biên bản chênh lệch (PDF)</button>
      <button class="btn btn-outline" onclick="exportAuditReportExcel()">&#128200; Xuất biên bản chênh lệch (Excel)</button>
    </div>
  </div>

  <div class="card" style="display:flex;gap:8px;flex-wrap:wrap;">
    ${statChip('Tổng kế hoạch', c.plannedTotal||0)}
    ${statChip('Đã kiểm kê', (c.matched||0)+(c.mismatch||0), 'teal-600')}
    ${statChip('Khớp', c.matched||0, 'ok')}
    ${statChip('Lệch', c.mismatch||0, 'warn')}
    ${statChip('Không tìm thấy', c.not_found||0, 'danger')}
    ${statChip('Phát hiện thừa', c.extra||0, 'warn')}
  </div>

  ${scanPanel}

  <div class="card">
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center;">
      <div class="search-box" style="max-width:280px;">
        <span class="ic">🔍</span>
        <input placeholder="Tìm mã tài sản, model, vị trí..." value="${escapeHtml(ui.auditItemSearch)}"
          oninput="ui.auditItemSearch=this.value; render();">
      </div>
      <select onchange="ui.auditItemFilter=this.value; render();" style="padding:8px 10px;border:1px solid var(--border);border-radius:8px;">
        ${filterOpts.map(([v,l])=>`<option value="${v}" ${ui.auditItemFilter===v?'selected':''}>${l}</option>`).join('')}
      </select>
      <span style="font-size:12px;color:var(--ink-400);">${items.length} / ${(b.items||[]).length} hạng mục</span>
    </div>
    <div style="overflow-x:auto;">
    <table>
      <thead><tr><th>Mã tài sản</th><th>Thiết bị</th><th>Vị trí (hệ thống)</th><th>Trạng thái</th><th>Người quét</th><th></th></tr></thead>
      <tbody>${rows || `<tr class="empty-row"><td colspan="6">Không có hạng mục nào khớp bộ lọc</td></tr>`}</tbody>
    </table>
    </div>
  </div>`;
}
function onAuditScanDeptChange(){
  ui.auditScanDeptId = val('scan_dept');
  ui.auditScanPosId = '';
  document.getElementById('scan_pos').innerHTML = posOptionsFor(ui.auditScanDeptId, '');
}
function renderLastScanPanel(){
  const r = _auditLastScan;
  if(!r) return '';
  const map = {
    matched:  ['ok', '✔ Khớp hoàn toàn'],
    mismatch: ['warn', '⚠ Đã ghi nhận — lệch vị trí'],
    extra:    ['warn', '⚠ Phát hiện thừa — thiết bị ngoài phạm vi đợt này'],
  };
  const [cls,label] = map[r.result] || ['muted', r.result];
  const it = r.item;
  return `
  <div class="card" style="background:var(--bg);margin-top:12px;margin-bottom:0;">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <div>
        <span class="badge ${cls}">${label}</span>
        <b style="margin-left:8px;">${escapeHtml(it.assetCode)}</b> — ${escapeHtml(it.model||'')}
      </div>
      <button class="btn btn-outline btn-sm" onclick="openAuditItemFix('${it.id}')">✏️ Ghi nhận lệch tình trạng</button>
    </div>
    <div style="font-size:12px;color:var(--ink-400);margin-top:4px;">
      Hệ thống: ${escapeHtml(it.deptName)} › ${escapeHtml(it.posName)} — Tình trạng: ${escapeHtml(it.status)}
    </div>
  </div>`;
}
async function submitAuditScan(){
  const code = val('scan_input');
  if(!code){ toast('Vui lòng quét hoặc nhập mã tài sản','warn'); return; }
  const payload = { code, currentDeptId: ui.auditScanDeptId, currentPosId: ui.auditScanPosId };
  let res;
  try{ res = await api('POST', `/api/audit/batches/${ui.auditBatchId}/scan`, payload); }
  catch(e){ document.getElementById('scan_input').value=''; document.getElementById('scan_input').focus(); return; }
  _auditLastScan = res;
  const msgMap = {matched:'✔ Khớp hoàn toàn', mismatch:'⚠ Đã ghi nhận — lệch vị trí', extra:'⚠ Phát hiện thừa ngoài phạm vi'};
  toast(`${res.item.assetCode}: ${msgMap[res.result]||res.result}`, res.result==='matched'?'ok':'warn');
  await loadAuditDetail(ui.auditBatchId);
  setTimeout(()=>{ const el=document.getElementById('scan_input'); if(el){ el.value=''; el.focus(); } }, 50);
}
function openAuditItemFix(itemId){
  const it = (_auditDetail.items||[]).find(x=>x.id===itemId);
  if(!it) return;
  openModal({
    title: `✏️ Ghi nhận tình trạng thực tế — ${it.assetCode}`,
    body: `
      <div class="field"><label>Tình trạng ghi trong hệ thống</label><input value="${escapeHtml(it.status)}" disabled></div>
      <div class="field"><label>Tình trạng thực tế</label>
        <select id="fix_status">${statusOptions(it.actualStatus||it.status)}</select>
      </div>
      <div class="field"><label>Ghi chú</label><input id="fix_note" value="${escapeHtml(it.note||'')}" placeholder="VD: Màn hình bị nứt góc trái..."></div>
    `,
    foot: `<button class="btn btn-outline" onclick="closeModal()">Hủy</button>
           <button class="btn btn-teal" onclick="submitAuditItemFix('${itemId}')">✔ Lưu</button>`
  });
}
async function submitAuditItemFix(itemId){
  const payload = { actualStatus: val('fix_status'), note: val('fix_note') };
  try{ await api('POST', `/api/audit/items/${itemId}/update`, payload); }catch(e){ return; }
  closeModal(); toast('Đã cập nhật tình trạng thực tế', 'ok');
  await loadAuditDetail(ui.auditBatchId);
}
async function closeAuditBatch(id){
  const b = _auditDetail;
  const pending = (b.counts && b.counts.pending) || 0;
  const msg = pending>0
    ? `Còn ${pending} thiết bị chưa được kiểm kê — khi đóng đợt, các thiết bị này sẽ tự động chuyển thành "Không tìm thấy". Tiếp tục đóng đợt?`
    : `Đóng đợt kiểm kê "${b.name}"? Sau khi đóng sẽ không thể tiếp tục quét.`;
  if(!confirm(msg)) return;
  try{ await api('POST', `/api/audit/batches/${id}/close`); }catch(e){ return; }
  toast('Đã đóng đợt kiểm kê', 'ok');
  await loadAuditDetail(id); await loadAuditBatches();
}
async function cancelAuditBatch(id){
  if(!confirm(`Hủy đợt kiểm kê "${_auditDetail.name}"? Dữ liệu đã quét sẽ được giữ lại nhưng đợt sẽ không thể tiếp tục.`)) return;
  try{ await api('POST', `/api/audit/batches/${id}/cancel`); }catch(e){ return; }
  toast('Đã hủy đợt kiểm kê', 'ok');
  await loadAuditDetail(id); await loadAuditBatches();
}

/* ---- Xuất biên bản chênh lệch (PDF) ---- */
const AUDIT_REPORT_COLUMNS = ['Mã Máy Tính','Thiết bị','Phòng/Ban (HT)','Vị trí (HT)','Trạng thái','Vị trí thực tế','Tình trạng thực tế','Người quét','Thời gian quét','Ghi chú'];
function auditReportRows(items){
  return items.map(it=>({
    'Mã tài sản': it.computerName,
    'Thiết bị': `${it.typeName||''} ${it.model||''}`.trim(),
    'Phòng/Ban (HT)': it.deptName,
    'Vị trí (HT)': it.posName,
    'Trạng thái': it.scanStatusLabel,
    'Vị trí thực tế': it.actualDeptId ? `${deptName(it.actualDeptId)} / ${posName(it.actualDeptId,it.actualPosId)}` : '—',
    'Tình trạng thực tế': it.actualStatus || it.status,
    'Người quét': it.scannedBy || '—',
    'Thời gian quét': it.scannedAt ? fmtDateTimeMs(it.scannedAt) : '—',
    'Ghi chú': it.note || '',
  }));
}
function exportAuditReportPDF(){
  const b = _auditDetail;
  if(!b){ toast('Chưa có dữ liệu đợt kiểm kê','warn'); return; }
  const items = b.items||[];
  if(!items.length){ toast('Đợt kiểm kê không có thiết bị nào','warn'); return; }
  const rows = auditReportRows(items);
  const c = b.counts||{};
  const subtitle = `${b.code} · ${auditScopeLabel(b)} · Tổng ${c.plannedTotal||0} — Khớp ${c.matched||0} — Lệch ${c.mismatch||0} — Không tìm thấy ${c.not_found||0} — Thừa ${c.extra||0}`;
  openPrintWindow(`BIÊN BẢN KIỂM KÊ — ${b.name}`, subtitle, AUDIT_REPORT_COLUMNS, rows, 'landscape');
}
function exportAuditReportExcel(){
  const b = _auditDetail;
  if(!b){ toast('Chưa có dữ liệu đợt kiểm kê','warn'); return; }
  const items = b.items||[];
  if(!items.length){ toast('Đợt kiểm kê không có thiết bị nào','warn'); return; }
  exportTableExcel('devices', `bien_ban_kiem_ke_${b.code||''}.xlsx`, 'Kiểm kê', AUDIT_REPORT_COLUMNS, auditReportRows(items));
}

/* ============================= DASHBOARD VIEW ============================= */
function kpiCard(tone, ic, val, lbl){
  return `
  <div class="kpi-card tone-${tone}">
    <div class="kpi-top"><div class="kpi-ic">${ic}</div></div>
    <div class="kpi-val">${val}</div>
    <div class="kpi-lbl">${lbl}</div>
  </div>`;
}
function barChartRows(rows, fillVar){
  if(!rows.length) return `<div class="chart-empty">Chưa có dữ liệu</div>`;
  const max = Math.max(...rows.map(r=>r.value), 1);
  return rows.map(r=>{
    const pct = Math.max(3, Math.round(r.value/max*100));
    return `
    <div class="bar-row">
      <div class="bar-label" title="${escapeHtml(r.label)}">${escapeHtml(r.label)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;${fillVar?`background:${fillVar};`:''}"></div></div>
      <div class="bar-value">${escapeHtml(r.display)}</div>
    </div>`;
  }).join('');
}
function groupCountBy(devices, keyFn, labelFn){
  const map = new Map();
  devices.forEach(d=>{
    const key = keyFn(d);
    if(key===null || key===undefined || key==='') return;
    if(!map.has(key)) map.set(key, {label: labelFn(d), count:0, value:0});
    const o = map.get(key);
    o.count += 1;
    o.value += Number(d.value)||0;
  });
  return Array.from(map.values()).sort((a,b)=>b.count-a.count);
}
function topWithOthers(rows, limit){
  if(rows.length<=limit) return rows;
  const top = rows.slice(0,limit);
  const rest = rows.slice(limit);
  top.push({
    label:'Khác',
    count: rest.reduce((s,r)=>s+r.count,0),
    value: rest.reduce((s,r)=>s+r.value,0),
  });
  return top;
}

/* Gộp nhóm danh sách phòng/ban theo chi nhánh (optgroup) để hiển thị chi nhánh
   ngay trong các dropdown chọn phòng/ban ở menu Thiết bị (thêm/sửa TB, xuất kho,
   mượn/trả, điều chuyển, kiểm kê...) — ràng buộc trực quan phòng/ban ↔ chi nhánh */
function deptOptionsGroupedHtml(items, selectedId){
  const branches = state.branches || [];
  if(!branches.length){
    return items.map(d=>`<option value="${d.id}" ${d.id===selectedId?'selected':''}>${escapeHtml(d.name)}</option>`).join('');
  }
  let html = '';
  branches.forEach(b=>{
    const list = items.filter(d=>d.branchId===b.id);
    if(!list.length) return;
    html += `<optgroup label="&#127970; ${escapeHtml(b.name)}">` +
      list.map(d=>`<option value="${d.id}" ${d.id===selectedId?'selected':''}>${escapeHtml(d.name)}</option>`).join('') +
      `</optgroup>`;
  });
  const unassigned = items.filter(d=>!d.branchId);
  if(unassigned.length){
    html += `<optgroup label="Chưa gán chi nhánh">` +
      unassigned.map(d=>`<option value="${d.id}" ${d.id===selectedId?'selected':''}>${escapeHtml(d.name)}</option>`).join('') +
      `</optgroup>`;
  }
  return html;
}
function deptOptions(selectedId){

function deptBranchName(deptId){ const d=deptById(deptId); return (d && d.branchId) ? branchName(d.branchId) : ''; }

/* TRÍCH XUẤT CẤU HÌNH MÁY TÍNH */
async function extractPCConfig(e){
  if(e) e.preventDefault();
  try {
    const res = await api('GET', '/api/system-info?type=specs');
    if(res.error){
      toast(res.error, 'warn');
      return;
    }
    const prefix = document.getElementById('de_hw_computerName') ? 'de' : 'ed';
    fillHwFields(prefix, res);
    if(res.serial) {
      const serialEl = document.getElementById(`${prefix}_serial`);
      if(serialEl) serialEl.value = res.serial;
    }
    if(res.model) {
      const modelEl = document.getElementById(`${prefix}_model`);
      if(modelEl) modelEl.value = res.model;
    }
    if(res.manufacturer) {
      const makerEl = document.getElementById(`${prefix}_maker`);
      if(makerEl) makerEl.value = res.manufacturer;
    }
    toast('Đã trích xuất cấu hình máy thành công từ hệ thống!', 'ok');
  } catch(err) {
    toast('Lỗi khi truy vấn cấu hình máy!', 'danger');
  }
}

/* THÔNG TIN MÀN HÌNH */
async function extractScreenInfo(e){
  if(e) e.preventDefault();
  try {
    const res = await api('GET', '/api/system-info?type=monitors');
    if(res.monitors && res.monitors.length > 0){
      const m = res.monitors[0];
      const prefix = document.getElementById('de_model') ? 'de' : 'ed';
      
      const modelEl = document.getElementById(`${prefix}_model`);
      const makerEl = document.getElementById(`${prefix}_maker`);
      const serialEl = document.getElementById(`${prefix}_serial`);
      
      if(modelEl) modelEl.value = m.name || '';
      if(makerEl) makerEl.value = m.manufacturer || '';

function confirmSelectPrinter(totalCount){
  for(let i=0; i<totalCount; i++){
    const rad = document.getElementById(`rad_printer_${i}`);
    if(rad && rad.checked){
      const pName = rad.value;
      const pSerial = rad.getAttribute('data-serial');
      const pMaker = rad.getAttribute('data-maker');
      
      const prefix = document.getElementById('de_model') ? 'de' : 'ed';
      const modelEl = document.getElementById(`${prefix}_model`);
      const makerEl = document.getElementById(`${prefix}_maker`);
      const serialEl = document.getElementById(`${prefix}_serial`);
      
      if(modelEl) modelEl.value = pName || '';
      if(makerEl) makerEl.value = pMaker || '';
      if(serialEl) serialEl.value = pSerial || '';

      clearHwFields(prefix);
      toast('Đã điền thông tin máy in & dọn dẹp phần cấu hình chi tiết!', 'ok');
      break;
    }
  }
  closeModal();
}

/* KIỂM TRA BẢN QUYỀN WINDOWS */
async function checkLicenseInfo(e){
  if(e) e.preventDefault();
  try {
    toast('Đang kiểm tra bản quyền trên máy...', 'ok');
    const res = await api('GET', '/api/system-info?type=license');
    if(res.error){
      toast(res.error, 'warn');

    const statusOk = res.licenseStatusCode === 1;

function resetDataEntryForm(){ render(); }
async function saveNewDevice(){
  if(!requireEdit('devices')) return;
  const deptId = val('de_dept'), posId = val('de_pos'), groupId = val('de_group'), typeId = val('de_type');
  if(!deptId || !posId || !groupId || !typeId){
    toast('Vui lòng chọn đủ Phòng/Ban, Vị trí, Nhóm và Loại thiết bị (*)', 'warn'); return;
  }
  
  const serialVal = val('de_serial');
  if(serialVal) {
    const isDup = state.devices.some(d => (d.serial || '').trim().toLowerCase() === serialVal.toLowerCase());
    if(isDup){
      toast(`Số Serial "${serialVal}" đã tồn tại trong hệ thống! Không thể ghi trùng.`, 'danger');
      return;
    }
  }

  const payload = Object.assign({
    deptId, posId, groupId, typeId,
    model: val('de_model'), manufacturer: val('de_maker'), serial: serialVal,
    status: val('de_status') || 'Bình thường',
    importDate: val('de_import') || todayISO(), allocateDate: val('de_allocate'),
    warrantyMonths: val('de_warranty'), warrantyUnit: val('de_warrantyUnit') || 'Tháng',
    supplier: val('de_supplier'), value: Number(val('de_value'))||0, note: val('de_note'),
    userId: val('de_user'),
  }, collectHwFields('de'));
  let created;
  try{ created = await api('POST', '/api/devices', payload); }catch(e){ return; }
  await refreshState();
  toast(`Đã lưu thiết bị ${created.assetCode} vào hệ thống`, 'ok');
  resetDataEntryForm();
}

async function runLicenseCheck(){
  const statusBadge = document.getElementById('license-status-badge');
  const verdictBanner = document.getElementById('license-verdict-banner');
  statusBadge.style.display = "inline-flex";
  statusBadge.className = "badge warn";
  statusBadge.innerText = "Trạng thái: Đang kiểm tra hệ thống và các phần mềm...";
  verdictBanner.style.display = "none";

  try {
    const res = await api('GET', '/api/system-info?type=specs');
    const keys = await api('GET', '/api/system-info?type=licensescan');
    const deep = await api('GET', '/api/system-info?type=windowsdeepscan');

    document.getElementById('res-os').innerText = res.osName || "Windows (không xác định)";
    document.getElementById('res-win-key').innerText = res.winKeyCurrent ? "Đã kích hoạt (Licensed)" : "Digital License (Active)";
    document.getElementById('res-win-productkey').innerText = keys.winKeyFull || "Không đọc được (Digital License gắn tài khoản/phần cứng)";

    // --- Kết quả quét sâu 7 mục cho Windows: hiển thị làm Ghi chú của dòng Windows + banner tổng ---
    const verdict = deep && deep.verdict;
    const osNoteEl = document.getElementById('res-os-note');
    if(verdict){
      osNoteEl.innerText = verdict.note;
      verdictBanner.style.display = "block";
      const bannerColors = {
        ok:    {bg:'#dcf7e6', border:'#a9e6c0', color:'#0f8a4b'},
        warn:  {bg:'#fdf0d8', border:'#f0dcae', color:'#b4650a'},
        danger:{bg:'#fde3e3', border:'#f2c6c6', color:'#c62a2a'},
      };
      const c = bannerColors[verdict.severity] || bannerColors.ok;
      verdictBanner.style.background = c.bg;
      verdictBanner.style.border = `1px solid ${c.border}`;
      verdictBanner.style.color = c.color;
      verdictBanner.innerHTML = `<b>Kết quả quét sâu Windows — ${escapeHtml(verdict.label)}:</b><br>` +
        verdict.findings.map(f=>`• ${escapeHtml(f)}`).join('<br>') +
        `<br><span style="opacity:.75;">Đây là công cụ hỗ trợ tham khảo dựa trên các dấu hiệu kỹ thuật đọc được trên máy, không phải kết luận pháp lý cuối cùng — vui lòng xác minh thêm trước khi ra quyết định.</span>`;
    } else {
      osNoteEl.innerText = "Không quét được các dấu hiệu sâu (có thể do máy không phải Windows hoặc thiếu quyền).";
    }

    const off = keys.officeApp;
    document.getElementById('res-office').innerText = off ? `${off.name}${off.version ? ' ('+off.version+')' : ''}` : "Không phát hiện cài đặt trên máy";
    document.getElementById('res-office-key').innerText = keys.officeLicStatus || (off ? "Không xác định (không tìm thấy ospp.vbs để kiểm tra)" : "N/A");
    document.getElementById('res-office-productkey').innerText = keys.officeKeyLast5 ? ("XXXXX-XXXXX-XXXXX-XXXXX-" + keys.officeKeyLast5) : "Không phát hiện ospp.vbs trên máy";
    document.getElementById('res-office-note').innerText = off ? (keys.officeKeyLast5 ? "Có vẻ đã kích hoạt hợp lệ." : "Khuyến nghị: kiểm tra và kích hoạt bản quyền Microsoft 365/Office qua tài khoản công ty.") : "—";

/* ============================= DEVICE LIST VIEW ============================= */
function filteredDevices(){
  const f = ui.listFilters;
  return state.devices.filter(d=>{
    if(f.search){
      const s = f.search.toLowerCase();
      const hay = [d.assetCode,d.model,d.serial,deptName(d.deptId),posName(d.deptId,d.posId),
        groupName(d.groupId),typeName(d.groupId,d.typeId),userName(d.userId)].join(' ').toLowerCase();
      if(!hay.includes(s)) return false;
    }
    if(f.groupId && d.groupId!==f.groupId) return false;
    if(f.typeId && d.typeId!==f.typeId) return false;
    if(f.branchId){
      const dept = deptById(d.deptId);
      const bId = dept ? (dept.branchId||'') : '';
      if(f.branchId==='__none__'){ if(bId) return false; }
      else if(bId!==f.branchId) return false;
    }
    if(f.deptId && d.deptId!==f.deptId) return false;
    if(f.posId && d.posId!==f.posId) return false;
    if(f.warranty && warrantyStatus(d).cls!==f.warranty) return false;
    if(f.status && (d.status||'')!==f.status) return false;
    if(f.supplier && (d.supplier||'')!==f.supplier) return false;
    if(f.userId){
      if(f.userId==='__none__' && d.userId) return false;
      if(f.userId!=='__none__' && d.userId!==f.userId) return false;
    }
    if(f.importFrom && (!d.importDate || d.importDate < f.importFrom)) return false;
    if(f.importTo && (!d.importDate || d.importDate > f.importTo)) return false;
    if(f.allocateFrom && (!d.allocateDate || d.allocateDate < f.allocateFrom)) return false;
    if(f.allocateTo && (!d.allocateDate || d.allocateDate > f.allocateTo)) return false;
    return true;
  });
}
function uniqueSuppliers(){
  return [...new Set(state.devices.map(d=>d.supplier).filter(Boolean))];
}
function actionHandoverSingle(id){
  ui.selectedDeviceIds.clear();
  ui.selectedDeviceIds.add(id);
  openHandoverModal();
}
function actionTransferSingle(id){
  ui.selectedDeviceIds.clear();
  ui.selectedDeviceIds.add(id);
  openTransferModal();
}
async function actionDeleteSingle(id){
  if(!requireEdit('devices')) return;
  const d = state.devices.find(x=>x.id===id);
  if(!d) return;
  if(!confirm(`Bạn chắc chắn muốn xóa thiết bị ${d.assetCode}?`)) return;
  try{ await api('POST', '/api/devices/delete', {ids:[id]}); }catch(e){ return; }
  ui.selectedDeviceIds.delete(id);
  await refreshState();
  toast('Đã xóa thiết bị thành công', 'ok');
  render();
}

  if(!ui.selectedDeviceIds.size){ toast('Vui lòng chọn ít nhất một thiết bị', 'warn'); return; }

function activeListFilterSummary(){
  const f = ui.listFilters;
  const parts = [];
  if(f.search) parts.push(`Từ khóa "${f.search}"`);
  if(f.groupId) parts.push(`Nhóm TB: ${groupName(f.groupId)}`);
  if(f.typeId) parts.push(`Loại TB: ${typeName(f.groupId, f.typeId)}`);
  if(f.branchId) parts.push(`Chi nhánh: ${f.branchId==='__none__' ? 'Chưa gán chi nhánh' : branchName(f.branchId)}`);
  if(f.deptId) parts.push(`Phòng/Ban: ${deptName(f.deptId)}`);
  if(f.posId) parts.push(`Vị trí: ${posName(f.deptId, f.posId)}`);
  if(f.warranty){
    const wLabels = {ok:'Bảo hành', warn:'Sắp hết bảo hành', danger:'Hết bảo hành', muted:'N/A'};
    parts.push(`Trạng thái BH: ${wLabels[f.warranty]||f.warranty}`);
  }
  if(f.status) parts.push(`Tình trạng TB: ${f.status}`);
  if(f.supplier) parts.push(`Nhà CC: ${f.supplier}`);
  if(f.importFrom || f.importTo) parts.push(`Ngày nhập: ${f.importFrom||'…'} — ${f.importTo||'…'}`);
  if(f.allocateFrom || f.allocateTo) parts.push(`Ngày phân bổ: ${f.allocateFrom||'…'} — ${f.allocateTo||'…'}`);
  return parts;
}

   Mã QR được sinh hoàn toàn phía server Python (không cần internet, không dùng

function qrSrc(id, size){
  return `/api/qr/${id}?size=${size||220}`;
}

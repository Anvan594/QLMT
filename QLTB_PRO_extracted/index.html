async function downloadQRSingle(id, assetCode){
  /* Tải file SVG QR về máy — mở bằng bất kỳ trình duyệt/trình xem ảnh nào */
  try{
    const resp = await fetch(qrSrc(id, 400));
    if(!resp.ok) throw new Error('Server trả về lỗi');
    const svg = await resp.text();
    const blob = new Blob([svg], {type:'image/svg+xml'});
    const url  = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `QR_${assetCode||id}.svg`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    toast(`Đã tải QR của ${assetCode||id}`, 'ok');
  }catch(e){
    toast('Không tải được QR — hãy chắc chắn server.py đang chạy', 'danger');
  }
}

async function saveEditDevice(id){
  if(!requireEdit('devices')) return;
  const deptId=val('ed_dept'), posId=val('ed_pos'), groupId=val('ed_group'), typeId=val('ed_type');
  if(!deptId||!posId||!groupId||!typeId){ toast('Vui lòng điền đủ các trường bắt buộc (*)', 'warn'); return; }
  
  const serialVal = val('ed_serial');
  if(serialVal) {
    const isDup = state.devices.some(d => d.id !== id && (d.serial || '').trim().toLowerCase() === serialVal.toLowerCase());
    if(isDup){
      toast(`Số Serial "${serialVal}" đã tồn tại trên thiết bị khác!`, 'danger');
      return;
    }
  }

  const payload = Object.assign({
    deptId, posId, groupId, typeId,
    model: val('ed_model'), manufacturer: val('ed_maker'), serial: serialVal,
    status: val('ed_status'),
    supplier: val('ed_supplier'), importDate: val('ed_import'), allocateDate: val('ed_allocate'),
    warrantyMonths: val('ed_warranty'), warrantyUnit: val('ed_warrantyUnit'),
    value: Number(val('ed_value'))||0, note: val('ed_note'),
    userId: val('ed_user'),
  }, collectHwFields('ed'));
  try{ await api('PUT', '/api/devices/'+id, payload); }catch(e){ return; }
  await refreshState(); closeModal(); toast('Đã cập nhật thiết bị', 'ok'); render();
}
async function deleteDeviceFromModal(id){
  if(!requireEdit('devices')) return;
  if(!confirm('Xóa thiết bị này khỏi hệ thống?')) return;
  try{ await api('POST', '/api/devices/delete', {ids:[id]}); }catch(e){ return; }
  ui.selectedDeviceIds.delete(id);
  await refreshState(); closeModal(); toast('Đã xóa thiết bị', 'ok'); render();
}

function onHandoverUserChange(){
  const uid = val('ho_user');
  if(!uid) return;
  const u = userById(uid);
  if(!u) return;
  const toInput = document.getElementById('ho_to');
  if(toInput) toInput.value = u.fullName;
  if(u.deptId){
    const deptSel = document.getElementById('ho_dept');
    const posSel = document.getElementById('ho_pos');
    if(deptSel) deptSel.value = u.deptId;
    if(posSel) posSel.innerHTML = posOptionsFor(u.deptId, u.posId || '');
  }
}
async function submitHandover(){
  if(!requireEdit('allocation')) return;
  const from=val('ho_from'), to=val('ho_to');
  if(!from||!to){ toast('Vui lòng nhập người bàn giao và người nhận', 'warn'); return; }
  const payload = {
    deviceIds: [...ui.selectedDeviceIds], from, to, date: val('ho_date')||todayISO(),
    newDeptId: val('ho_dept'), newPosId: val('ho_pos'), note: val('ho_note'),
    userId: val('ho_user')
  };
  try{ await api('POST', '/api/devices/handover', payload); }catch(e){ return; }
  await refreshState(); closeModal(); ui.selectedDeviceIds.clear();
  toast('Đã tạo biên bản bàn giao', 'ok'); ui.allocationTab='handover'; switchView('allocation');
}

function renderUsersView(){
  const depts = state.departments;
  const users = state.users || [];
  const filterDept = ui.userFilterDept || '';
  const filterSearch = ui.userFilterSearch || '';
  const filtered = users.filter(u=>{
    if(filterDept && u.deptId !== filterDept) return false;
    if(filterSearch && !(`${u.fullName} ${u.email||''} ${u.phone||''} ${u.position||''}`).toLowerCase().includes(filterSearch.toLowerCase())) return false;
    return true;
  });
  // đếm số thiết bị đang gán cho mỗi user
  const deviceCount = {};
  (state.devices||[]).forEach(d=>{ if(d.userId) deviceCount[d.userId] = (deviceCount[d.userId]||0)+1; });

  const rows = filtered.map((u,i)=>`
    <tr>
      <td>${i+1}</td>
      <td><b>${escapeHtml(u.fullName)}</b></td>
      <td>${u.deptId ? escapeHtml(deptName(u.deptId)) : '<span class="muted-text">Chưa gán</span>'}</td>
      <td>${u.posId ? escapeHtml(userPos(u.id)) : '<span class="muted-text">—</span>'}</td>
      <td>${escapeHtml(u.position||'')}</td>
      <td>${escapeHtml(u.email||'')}</td>
      <td>${escapeHtml(u.phone||'')}</td>
      <td><span class="badge ${(deviceCount[u.id]||0)>0?'ok':'muted'}">${deviceCount[u.id]||0} thiết bị</span></td>
      <td>
        ${editOnly('users', `<button class="btn btn-outline btn-sm" onclick="openUserModal('${u.id}')">&#9998; Sửa</button>`)}
        ${editOnly('users', `<button class="btn btn-danger btn-sm" onclick="deleteUser('${u.id}')">&#128465;</button>`)}
      </td>
    </tr>`).join('');
  return `
  <div class="page-head">
    <div><h1>&#128101; Quản lý Người dùng</h1><div class="desc">${users.length} người dùng — ${filtered.length} đang hiển thị</div></div>
    <div class="head-actions">
      <button type="button" class="btn btn-outline" onclick="exportUsersPDF()">&#128196; Xuất PDF</button>
      <button type="button" class="btn btn-outline" onclick="exportUsersExcel()">&#128200; Xuất Excel</button>
      ${editOnly('users', `
      <button type="button" class="btn btn-outline" onclick="downloadImportTemplate('users')">&#8615; Tải file mẫu Excel</button>
      <label class="btn btn-outline" style="margin:0;">
        &#8613; Nhập từ Excel
        <input type="file" accept=".xlsx" style="display:none;" onchange="importExcelFile(event,'users')">
      </label>
      <button class="btn btn-teal" onclick="openUserModal(null)">+ Thêm người dùng</button>`)}
    </div>
  </div>
  <div class="card">
    <div class="toolbar" style="margin-bottom:12px;">
      <div class="search-box">
        <span class="ic">&#128269;</span>
        <input placeholder="Tìm theo tên, email, điện thoại, chức vụ..." value="${escapeHtml(filterSearch)}"
          oninput="ui.userFilterSearch=this.value; render();">
      </div>
      <select style="padding:8px 10px;border:1px solid var(--border);border-radius:8px;"
        onchange="ui.userFilterDept=this.value; render();">
        <option value="">Tất cả phòng/ban</option>
        ${depts.map(d=>`<option value="${d.id}" ${filterDept===d.id?'selected':''}>${escapeHtml(d.name)}</option>`).join('')}
      </select>
    </div>
    <div style="overflow-x:auto;">
    <table>
      <thead><tr><th>STT</th><th>Họ tên</th><th>Phòng/Ban</th><th>Vị trí cụ thể</th><th>Chức vụ</th><th>Email</th><th>Điện thoại</th><th>Thiết bị đang dùng</th><th></th></tr></thead>
      <tbody>
        ${filtered.length ? rows : `<tr class="empty-row"><td colspan="9">Chưa có người dùng nào. Nhấn "+ Thêm người dùng" để bắt đầu.</td></tr>`}
      </tbody>
    </table>
    </div>
  </div>`;
}
function filteredUsersForExport(){
  const filterDept = ui.userFilterDept || '';
  const filterSearch = ui.userFilterSearch || '';
  return (state.users||[]).filter(u=>{
    if(filterDept && u.deptId !== filterDept) return false;
    if(filterSearch && !(`${u.fullName} ${u.email||''} ${u.phone||''} ${u.position||''}`).toLowerCase().includes(filterSearch.toLowerCase())) return false;
    return true;
  });
}
function userExportRows(){
  const filtered = filteredUsersForExport();
  const deviceCount = {};
  (state.devices||[]).forEach(d=>{ if(d.userId) deviceCount[d.userId] = (deviceCount[d.userId]||0)+1; });
  return filtered.map((u,i)=>({
    'STT': i+1, 'Họ tên': u.fullName,
    'Phòng/Ban': u.deptId ? deptName(u.deptId) : '—',
    'Vị trí cụ thể': u.posId ? userPos(u.id) : '—',
    'Chức vụ': u.position||'', 'Email': u.email||'', 'Điện thoại': u.phone||'',
    'Số thiết bị đang dùng': deviceCount[u.id]||0, 'Ghi chú': u.note||'',
  }));
}
function exportUsersPDF(){
  const rows = userExportRows();
  const columns = ['STT','Họ tên','Phòng/Ban','Vị trí cụ thể','Chức vụ','Email','Điện thoại','Số thiết bị đang dùng','Ghi chú'];
  openPrintWindow('DANH SÁCH NGƯỜI DÙNG', `Tổng ${rows.length} người dùng`, columns, rows, 'landscape');
}
function exportUsersExcel(){
  const rows = userExportRows();
  const columns = ['STT','Họ tên','Phòng/Ban','Vị trí cụ thể','Chức vụ','Email','Điện thoại','Số thiết bị đang dùng','Ghi chú'];
  exportTableExcel('users', 'danh_sach_nguoi_dung.xlsx', 'Người dùng', columns, rows);
}

      </select></div>
      <div class="field"><label>Vị trí cụ thể</label><select id="um_pos">${posOptionsFor(u&&u.deptId||'', u&&u.posId||'')}</select></div>
      <div class="field"><label>Chức vụ / Vị trí công việc</label><input id="um_position" value="${escapeHtml(u&&u.position||'')}"></div>
      <div class="field"><label>Email</label><input type="email" id="um_email" value="${escapeHtml(u&&u.email||'')}"></div>
      <div class="field"><label>Điện thoại</label><input id="um_phone" value="${escapeHtml(u&&u.phone||'')}"></div>
      <div class="field"><label>Ghi chú</label><input id="um_note" value="${escapeHtml(u&&u.note||'')}"></div>
    </div>`;
  openModal({
    title,
    body,
    foot: `
      <button class="btn btn-outline" onclick="closeModal()">Hủy</button>
      <button class="btn btn-teal" onclick="saveUser(${id?`'${id}'`:'null'})">&#10003; Lưu</button>
    `
  });
}
async function saveUser(id){
  if(!requireEdit('users')) return;
  const name = val('um_name');
  if(!name){ toast('Vui lòng nhập họ và tên', 'warn'); return; }
  const payload = { fullName: name, deptId: val('um_dept'), posId: val('um_pos'), position: val('um_position'), email: val('um_email'), phone: val('um_phone'), note: val('um_note') };
  try{
    if(id) await api('PUT', '/api/users/'+id, payload);
    else await api('POST', '/api/users', payload);
  }catch(e){ return; }
  await refreshState(); closeModal(); toast(id ? 'Đã cập nhật người dùng' : 'Đã thêm người dùng', 'ok'); render();
}
async function deleteUser(id){
  if(!requireEdit('users')) return;
  const u = (state.users||[]).find(x=>x.id===id);
  if(!u) return;
  const devCount = (state.devices||[]).filter(d=>d.userId===id).length;
  const msg = devCount > 0
    ? `Xóa "${u.fullName}"? Người này đang được gán cho ${devCount} thiết bị — các thiết bị đó sẽ được gỡ người dùng.`
    : `Xóa "${u.fullName}"?`;
  if(!confirm(msg)) return;
  try{ await api('DELETE', '/api/users/'+id); }catch(e){ return; }
  await refreshState(); toast('Đã xóa người dùng', 'ok'); render();
}

let statsCache = { departments: [], total: 0, loading: true };
async function loadStats(){
  statsCache.loading = true;
  if(ui.view==='reports' && ui.reportsTab==='stats') render();
  const gid = ui.statsGroupId;
  const qs = gid ? ('?groupId='+encodeURIComponent(gid)) : '';
  try{
    const data = await api('GET', '/api/stats'+qs);
    statsCache = Object.assign({loading:false}, data);
  }catch(e){
    statsCache = { departments: [], total: 0, loading:false };
  }
  if(ui.view==='reports' && ui.reportsTab==='stats') render();
}
function onStatsGroupChange(v){ ui.statsGroupId = v; loadStats(); }
function renderStatsView(){
  const gid = ui.statsGroupId;
  let bodyRows = '';
  if(!statsCache.loading){
    let letterIdx=0;
    const LETTERS='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    bodyRows = (statsCache.departments||[]).map(dr=>{
      const letter = LETTERS[letterIdx++] || '?';
      const posHtml = (dr.positions||[]).map((p,i)=>`
        <tr><td>${i+1}</td><td>&#8627; ${escapeHtml(p.name)}</td><td>${p.count}</td></tr>`).join('');
      return `<tr class="stat-group"><td>${letter}</td><td>${escapeHtml(dr.name)}</td><td>${dr.count}</td></tr>${posHtml}`;
    }).join('');
  }
  const hasRows = !statsCache.loading && statsCache.departments && statsCache.departments.length;
  return `
  <div class="page-head">
    <div><h1>&#128202; Bảng thống kê số lượng thiết bị</h1><div class="desc">Dữ liệu tính trực tiếp từ server theo phòng/ban và vị trí</div></div>
    <div class="head-actions">
      <select onchange="onStatsGroupChange(this.value)" style="padding:8px 10px;border:1px solid var(--border);border-radius:8px;">
        <option value="">Nhóm TB: Tất cả</option>
        ${state.groups.map(g=>`<option value="${g.id}" ${gid===g.id?'selected':''}>${escapeHtml(g.name)}</option>`).join('')}
      </select>
      <button type="button" class="btn btn-outline" onclick="loadStats()">&#8635; Làm mới</button>
      <button type="button" class="btn btn-teal" onclick="exportStatsPDF()">&#128196; Xuất PDF</button>
      <button type="button" class="btn btn-outline" onclick="exportStatsExcel()">&#128200; Xuất Excel</button>
    </div>
  </div>
  <div class="card">
    <div style="overflow-x:auto;">
    <table style="max-width:640px;">
      <thead><tr><th>STT</th><th>Phòng/Ban – Vị trí</th><th>Số lượng</th></tr></thead>
      <tbody>
        <tr class="stat-total"><td colspan="2">TỔNG SỐ LƯỢNG THIẾT BỊ</td><td>${statsCache.loading ? '…' : statsCache.total}</td></tr>
        ${statsCache.loading ? `<tr class="empty-row"><td colspan="3">Đang tải từ server...</td></tr>` :
          (hasRows ? bodyRows : `<tr class="empty-row"><td colspan="3">Chưa có dữ liệu thống kê</td></tr>`)}
      </tbody>
    </table>
    </div>
  </div>`;

function statsExportRows(){
  const gid = ui.statsGroupId;
  const devices = state.devices.filter(d=> !gid || d.groupId===gid);
  const rows = [];
  let stt = 1;
  state.departments.forEach(dept=>{
    dept.positions.forEach(pos=>{
      const count = devices.filter(d=>d.deptId===dept.id && d.posId===pos.id).length;
      if(count>0) rows.push({'STT': stt++, 'Phòng/Ban': dept.name, 'Vị trí': pos.name, 'Số lượng': count});

  });
  return rows;

function exportStatsExcel(){
  const rows = statsExportRows();

function settingsSubTabs(){
  // Mục "Phân quyền" chỉ chỉnh sửa được bởi admin (server luôn từ chối POST
  // /api/settings/permissions từ tài khoản khác) nên chỉ hiện cho admin.
  const all = [
    {id:'accounts', label:'Tài khoản đăng nhập', ic:'👤', mod:'accounts'},
    {id:'permissions', label:'Phân quyền', ic:'🔐', mod:null, adminOnly:true},
    {id:'logs', label:'Nhật ký', ic:'🕒', mod:'logs'},
    {id:'settings', label:'Cài đặt', ic:'⚙️', mod:'settings'},
  ];
  return all.filter(t => t.adminOnly ? isAdmin() : canView(t.mod));
}
function renderSettingsView(){
  const tabs = settingsSubTabs();
  if(!tabs.length){
    return `<div class="card"><h3>Không có quyền truy cập</h3><div class="hint">Bạn chưa được cấp quyền xem mục nào trong Hệ thống. Vui lòng liên hệ quản trị viên.</div></div>`;
  }
  let tab = ui.settingsTab || 'settings';
  if(!tabs.some(t=>t.id===tab)) tab = tabs[0].id;
  const tabsHtml = groupTabs(tabs, tab, 'setSettingsTab');
  let body;
  if(tab==='accounts') body = renderSystemAccountsView();
  else if(tab==='permissions') body = renderPermissionsView();
  else if(tab==='logs') body = renderLogsView();
  else body = renderSettingsMainView();
  return tabsHtml + body;
}
function setSettingsTab(t){
  const tabs = settingsSubTabs();
  if(!tabs.some(x=>x.id===t)){
    toast('Bạn không có quyền truy cập mục này.', 'warn');
    t = tabs.length ? tabs[0].id : t;

}

function openAccountModal(id){
  const a = id ? (state.accounts||[]).find(x=>x.id===id) : null;
  const title = a ? `Sửa tài khoản — ${a.username}` : 'Thêm tài khoản mới';

      </div>
      <div class="field">
        <label>${a?'Mật khẩu mới':'Mật khẩu'} ${a?'':'<span class="req">*</span>'}</label>

      </div>
      <div class="field"><label>Họ và tên <span class="req">*</span></label><input id="am_fullname" value="${escapeHtml(a&&a.fullName||'')}"></div>
      <div class="field"><label>Vai trò</label><select id="am_role">
        <option value="admin" ${a&&a.role==='admin'?'selected':''}>Quản trị viên</option>
        <option value="staff" ${!a||a.role==='staff'?'selected':''}>Nhân viên</option>
        <option value="viewer" ${a&&a.role==='viewer'?'selected':''}>Chỉ xem</option>
      </select>
      </div>
      <div class="field"><label>Trạng thái</label><select id="am_status">
        <option value="active" ${!a||a.status==='active'?'selected':''}>Đang hoạt động</option>
        <option value="locked" ${a&&a.status==='locked'?'selected':''}>Đã khóa</option>
      </select></div>
      <div class="field"><label>Ghi chú</label><input id="am_note" value="${escapeHtml(a&&a.note||'')}"></div>
    </div>`;
  openModal({
    title,
    body,
    foot: `
      <button class="btn btn-outline" onclick="closeModal()">Hủy</button>
      <button class="btn btn-teal" onclick="saveAccount(${id?`'${id}'`:'null'})">&#10003; Lưu</button>
    `
  });
}
async function saveAccount(id){
  if(!requireEdit('accounts')) return;
  const fullName = val('am_fullname');
  if(!fullName){ toast('Vui lòng nhập họ và tên', 'warn'); return; }
  const password = val('am_password');
  const payload = { fullName, role: val('am_role'), status: val('am_status'), note: val('am_note') };
  if(!id){
    const username = val('am_username');
    if(!username){ toast('Vui lòng nhập tên đăng nhập', 'warn'); return; }
    if(!password){ toast('Vui lòng nhập mật khẩu', 'warn'); return; }
    payload.username = username;
    payload.password = password;
  } else if(password){
    payload.password = password;
  }
  try{
    if(id) await api('PUT', '/api/accounts/'+id, payload);
    else await api('POST', '/api/accounts', payload);
  }catch(e){ return; }
  await refreshState(); closeModal(); toast(id ? 'Đã cập nhật tài khoản' : 'Đã thêm tài khoản', 'ok'); render();
}
async function toggleAccountStatus(id){
  if(!requireEdit('accounts')) return;
  const a = (state.accounts||[]).find(x=>x.id===id);
  if(!a) return;
  const nextStatus = a.status==='active' ? 'locked' : 'active';
  try{
    await api('PUT', '/api/accounts/'+id, { fullName:a.fullName, role:a.role, status:nextStatus, note:a.note||'' });
  }catch(e){ return; }
  await refreshState(); toast(nextStatus==='active' ? 'Đã mở khóa tài khoản' : 'Đã khóa tài khoản', 'ok'); render();
}
async function deleteAccount(id){
  if(!requireEdit('accounts')) return;
  const a = (state.accounts||[]).find(x=>x.id===id);
  if(!a) return;
  if(!confirm(`Xóa tài khoản "${a.username}" (${a.fullName})?`)) return;
  try{ await api('DELETE', '/api/accounts/'+id); }catch(e){ return; }
  await refreshState(); toast('Đã xóa tài khoản', 'ok'); render();
}

/* ---- Nhập / Xuất Excel (mẫu nhập liệu bằng file .xlsx) ---- */
function readFileAsBase64(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      // reader.result dạng "data:<mime>;base64,AAAA..." — chỉ lấy phần sau dấu phẩy
      const s = String(reader.result || '');
      const idx = s.indexOf(',');
      resolve(idx>=0 ? s.slice(idx+1) : s);
    };
    reader.onerror = ()=> reject(reader.error);
    reader.readAsDataURL(file);
  });
}
async function downloadBase64File(filename, base64){
  // Chạy trong app desktop (pywebview): nếu có cầu nối lưu file nhị phân thì dùng,
  // giống cơ chế downloadBackup() ở dưới; nếu không có thì dùng cách tải xuống
  // chuẩn của trình duyệt bằng Blob + thẻ <a download>.
  if(window.pywebview && window.pywebview.api && window.pywebview.api.save_binary_file){
    const result = await window.pywebview.api.save_binary_file(filename, base64);
    if(result && result.ok){ toast('Đã lưu file: ' + (result.path || filename), 'ok'); return; }
    if(result && result.cancelled) return;
    if(result && result.error){ toast('Không thể lưu file: ' + result.error, 'danger'); return; }
  }
  const byteChars = atob(base64);
  const byteNums = new Array(byteChars.length);
  for(let i=0;i<byteChars.length;i++) byteNums[i] = byteChars.charCodeAt(i);
  const blob = new Blob([new Uint8Array(byteNums)], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
/* Xuất Excel dùng chung cho các màn hình danh sách (bảo trì, mượn/trả, lịch sử,
   nhật ký, tồn kho vật tư, người dùng, thiết bị...). columns: mảng tên cột
   hiển thị (cũng là khóa trong mỗi object của rows). module: tên module để
   server kiểm tra quyền xem tương ứng (vd 'users', 'maintenance'...), có thể
   để trống nếu màn hình không gắn với module phân quyền riêng. */
async function exportTableExcel(module, filename, sheetName, columns, rows){
  if(!rows || !rows.length){ toast('Không có dữ liệu để xuất', 'warn'); return; }
  try{
    const res = await api('POST', '/api/export/xlsx', {module, filename, sheetName, columns, rows});
    await downloadBase64File(res.filename, res.base64);
    toast('Đang xuất file Excel...', 'ok');
  }catch(e){ /* toast lỗi đã hiển thị trong api() */ }
}
async function downloadImportTemplate(kind){
  // kind: 'devices' | 'users'
  try{
    const res = await api('GET', kind==='devices' ? '/api/devices/import-template' : '/api/users/import-template');
    await downloadBase64File(res.filename, res.base64);
    toast('Đang tải file mẫu Excel...', 'ok');

function showImportResultModal(kind, res){
  const noun = kind==='devices' ? 'thiết bị' : 'người dùng';
  const errList = (res.errors||[]).length
    ? `<div class="hint" style="margin-top:10px;"><b>Chi tiết ${res.errors.length} dòng cần chú ý:</b></div>
       <div style="max-height:260px;overflow-y:auto;margin-top:6px;">

async function importExcelFile(evt, kind){
  // kind: 'devices' | 'users'
  const file = evt.target.files[0];
  evt.target.value = '';
  if(!file) return;
  if(!/\.xlsx$/i.test(file.name)){ toast('Vui lòng chọn file Excel (.xlsx)', 'warn'); return; }
  try{
    const base64 = await readFileAsBase64(file);
    const res = await api('POST', kind==='devices' ? '/api/devices/import' : '/api/users/import', {fileBase64: base64});
    await refreshState();
    render();
    showImportResultModal(kind, res);
  }catch(e){ /* toast lỗi đã hiển thị trong api() */ }
}

/* ---- Backup / Restore ---- */
async function downloadBackup(){
  if(!isAdmin()){ toast('Chỉ quản trị viên mới có quyền thực hiện thao tác này.', 'warn'); return; }
  try{
    const res = await fetch('/api/backup', { headers: authToken ? {'Authorization':'Bearer '+authToken} : {} });
    if(res.status===401){ clearSession(); renderLoginScreen('Phiên đăng nhập đã hết hạn, vui lòng đăng nhập lại.'); return; }
    if(!res.ok){ toast('Lỗi khi tải bản sao lưu', 'danger'); return; }
    const cd = res.headers.get('Content-Disposition') || '';
    const match = /filename="?([^"]+)"?/.exec(cd);
    const filename = match ? match[1] : `qltb_backup_${Date.now()}.json`;

    // Chạy trong app desktop (pywebview): cơ chế tải xuống kiểu web thông
    // thường (Blob + thẻ <a download>) không hoạt động trong cửa sổ pywebview,
    // nên dùng cầu nối API để Python mở hộp thoại lưu file gốc của hệ điều hành.
    if(window.pywebview && window.pywebview.api && window.pywebview.api.save_json_file){
      const text = await res.text();
      const result = await window.pywebview.api.save_json_file(filename, text);
      if(result && result.ok){
        toast('Đã lưu bản sao lưu: ' + (result.path || filename), 'ok');
      }else if(!(result && result.cancelled)){
        toast('Không thể lưu file: ' + ((result && result.error) || 'Lỗi không xác định'), 'danger');
      }
      return;
    }

    // Chạy trên trình duyệt thông thường: dùng cơ chế tải xuống chuẩn của web
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    toast('Đang tải xuống bản sao lưu...', 'ok');
  }catch(e){
    toast('Không thể kết nối tới server backend.', 'danger');
  }
}
function restoreBackup(evt){
  if(!isAdmin()){ toast('Chỉ quản trị viên mới có quyền khôi phục dữ liệu.', 'warn'); evt.target.value=''; return; }
  const file = evt.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = async (e)=>{
    let data;
    try{ data = JSON.parse(e.target.result); }
    catch(err){ toast('Tệp sao lưu không hợp lệ', 'danger'); return; }
    try{ await api('POST', '/api/restore', data); }catch(err){ return; }
    await refreshState();
    ui.selectedDeviceIds.clear(); ui.selectedHistoryIds.clear();
    ui.devicesTab = 'list';
    switchView('devices');
    toast('Khôi phục dữ liệu thành công', 'ok');
  };
  reader.readAsText(file);
  evt.target.value = '';
}
